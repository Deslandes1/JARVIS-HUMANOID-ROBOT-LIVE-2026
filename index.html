<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - Scholar Humanoid AI</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        :root {
            --accent: #b8860b;
            --accent-2: #ffc72c;
            --cyan: #00e5ff;
            --danger: #dc2626;
            --success: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        html, body { height: 100%; }
        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #120b36;
            color: #fff;
        }
        .galaxy-bg {
            position: fixed; inset: -10%; z-index: -2;
            background:
                radial-gradient(circle at 15% 20%, #7b4bff 0%, transparent 42%),
                radial-gradient(circle at 85% 15%, #00c2ff 0%, transparent 42%),
                radial-gradient(circle at 75% 80%, #ff4fa3 0%, transparent 45%),
                radial-gradient(circle at 25% 85%, #ffc72c 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, #4b2fbf 0%, transparent 60%),
                linear-gradient(160deg, #120b36 0%, #241a6b 30%, #0e3a7a 65%, #2a0f4d 100%);
            filter: saturate(1.35) brightness(1.15);
            animation: galaxyDrift 34s ease-in-out infinite alternate;
        }
        @keyframes galaxyDrift {
            from { transform: scale(1) rotate(0deg); }
            to   { transform: scale(1.09) rotate(2.5deg); }
        }
        .galaxy-stars {
            position: fixed; inset: -30%; z-index: -1; pointer-events: none;
            background-image:
                radial-gradient(1.7px 1.7px at 20px 30px, #ffffff, transparent),
                radial-gradient(1.2px 1.2px at 120px 90px, #ffe9b0, transparent),
                radial-gradient(1.9px 1.9px at 230px 150px, #d6f2ff, transparent),
                radial-gradient(1px 1px at 60px 210px, #ffffff, transparent),
                radial-gradient(1.5px 1.5px at 180px 260px, #ffd6f2, transparent),
                radial-gradient(1px 1px at 300px 70px, #ffffff, transparent),
                radial-gradient(1.7px 1.7px at 350px 220px, #e8f6ff, transparent),
                radial-gradient(1.1px 1.1px at 400px 330px, #ffffff, transparent),
                radial-gradient(1.3px 1.3px at 90px 340px, #fff3c4, transparent),
                radial-gradient(1px 1px at 260px 380px, #ffffff, transparent);
            background-size: 430px 400px;
            background-repeat: repeat;
            animation: twinkle 5s ease-in-out infinite alternate, starDrift 120s linear infinite;
        }
        @keyframes twinkle { from { opacity: .55; } to { opacity: 1; } }
        @keyframes starDrift { from { transform: translate3d(0,0,0); } to { transform: translate3d(-70px,-45px,0); } }
        .top-hud {
            position: fixed;
            top: 14px;
            left: 14px;
            right: 14px;
            z-index: 50;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            pointer-events: none;
        }
        .top-left-stack {
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: auto;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.85);
            border: 1.5px solid rgba(255, 199, 44, 0.55);
            backdrop-filter: blur(10px);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            color: var(--accent-2);
        }
        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--accent-2);
            box-shadow: 0 0 10px var(--accent-2);
        }
        .hud-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .hud-btn {
            background: rgba(15, 23, 42, 0.85);
            color: #fff;
            border: 1px solid rgba(255, 199, 44, 0.45);
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 0.74rem;
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: transform 0.15s, border-color 0.2s, background 0.2s;
        }
        .hud-btn:hover {
            border-color: var(--accent-2);
            background: rgba(30, 41, 59, 0.95);
            transform: translateY(-1px);
        }
        .hud-btn.active {
            border-color: var(--cyan);
            color: var(--cyan);
        }
        .owner-card {
            pointer-events: auto;
            background: rgba(255,255,255,0.94);
            backdrop-filter: blur(14px);
            border: 2px solid var(--accent-2);
            border-radius: 14px;
            padding: 12px 16px;
            text-align: right;
            font-size: 0.82rem;
            color: #475569;
            line-height: 1.5;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            max-width: 255px;
        }
        .owner-card strong {
            color: var(--accent);
            font-size: 0.95rem;
            display: block;
            margin-bottom: 2px;
        }
        .owner-card .edu-pill {
            display: inline-block;
            margin: 6px 0 6px;
            font-size: 0.68rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffc72c, #ff8a00);
            color: #3b2a00;
            padding: 3px 10px;
            border-radius: 10px;
            letter-spacing: 0.5px;
        }
        .owner-card a {
            display: block;
            color: #7a5200;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.76rem;
            margin-top: 4px;
            transition: color .15s;
        }
        .owner-card a:hover { color: var(--accent); text-decoration: underline; }
        body.video-mode .owner-card,
        body.video-mode .chat-bar {
            display: none;
        }
        .stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            min-height: 0;
            overflow: hidden;
        }
        .robot-wrap {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #robotBody {
            height: 100%;
            width: auto;
            display: block;
            filter: drop-shadow(0 12px 34px rgba(255,199,44,0.45));
            transition: filter 0.3s ease, transform 0.45s ease;
        }
        .chest-mic {
            position: absolute;
            top: 36.2%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #FFF4C2, #FFC72C 60%, #B87A00 100%);
            border: 2.5px solid #ffffff;
            color: #2a1c00;
            font-size: 1.3rem;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 18px rgba(255,199,44,0.9), inset 0 0 10px rgba(255,255,255,0.55);
            animation: micGlow 2.4s ease-in-out infinite;
            transition: transform .15s, background .2s;
        }
        .chest-mic:hover { transform: translate(-50%, -50%) scale(1.12); }
        .chest-mic:active { transform: translate(-50%, -50%) scale(0.95); }
        .chest-mic.listening {
            background: radial-gradient(circle at 30% 30%, #FFB0B0, #DC2626 60%, #7F1D1D 100%);
            color: #ffffff;
            animation: micListen 1s ease-in-out infinite;
        }
        @keyframes micGlow {
            0%, 100% { box-shadow: 0 0 18px rgba(255,199,44,0.9), inset 0 0 10px rgba(255,255,255,0.55); }
            50% { box-shadow: 0 0 32px rgba(255,199,44,1), inset 0 0 15px rgba(255,255,255,0.9); }
        }
        @keyframes micListen {
            0%, 100% { box-shadow: 0 0 22px rgba(220,38,38,0.95); }
            50% { box-shadow: 0 0 42px rgba(220,38,38,1); }
        }
        #robotBody .eye-bar { animation: eyeIdle 3.4s ease-in-out infinite; }
        #robotBody .core { animation: coreIdle 2.5s ease-in-out infinite; }
        #robotBody .halo-ring { transform-origin: 120px 250px; animation: haloSpin 36s linear infinite; }
        #robotBody .head-group { transform-box: view-box; transform-origin: 120px 104px; transition: transform 0.4s ease; }
        .arm-left, .arm-right {
            transform-box: view-box;
            transition: transform 0.5s ease-in-out;
        }
        .arm-left  { transform-origin: 58px 134px; }
        .arm-right { transform-origin: 182px 134px; }
        #robotBody:not(.speaking) .head-group { animation: headIdle 5.5s ease-in-out infinite; }
        #robotBody:not(.speaking) .arm-left  { animation: armIdleLeft 5.8s ease-in-out infinite; }
        #robotBody:not(.speaking) .arm-right { animation: armIdleRight 6.4s ease-in-out infinite; }
        #robotBody.speaking .head-group { animation: headSpeak 1.6s ease-in-out infinite; }
        #robotBody.speaking .arm-left  { animation: armSpeakLeft var(--arm-speed-left, 2400ms) ease-in-out infinite; }
        #robotBody.speaking .arm-right { animation: armSpeakRight var(--arm-speed-right, 2700ms) ease-in-out infinite; }
        @keyframes headIdle {
            0%, 100% { transform: rotate(0deg); }
            50%      { transform: rotate(2.2deg); }
        }
        @keyframes headSpeak {
            0%, 100% { transform: rotate(0deg) translateY(0); }
            50%      { transform: rotate(-2.5deg) translateY(-2px); }
        }
        @keyframes armIdleLeft {
            0%, 100% { transform: rotate(0deg); }
            50%      { transform: rotate(-3deg); }
        }
        @keyframes armIdleRight {
            0%, 100% { transform: rotate(0deg); }
            50%      { transform: rotate(3deg); }
        }
        @keyframes armSpeakLeft {
            0%   { transform: rotate(0deg); }
            30%  { transform: rotate(-16deg); }
            65%  { transform: rotate(-6deg); }
            100% { transform: rotate(0deg); }
        }
        @keyframes armSpeakRight {
            0%   { transform: rotate(0deg); }
            35%  { transform: rotate(15deg); }
            70%  { transform: rotate(5deg); }
            100% { transform: rotate(0deg); }
        }
        #robotBody.speaking {
            filter: drop-shadow(0 12px 44px rgba(255,199,44,0.95));
            transform: translateY(-4px);
        }
        #robotBody.speaking .eye-bar { animation: eyeSpeak .22s ease-in-out infinite; fill: #ffffff; }
        #robotBody.speaking .mouth-group { transform-origin: 120px 88px; animation: mouthSpeak .19s ease-in-out infinite; }
        #robotBody.speaking .core { animation: coreSpeak .28s ease-in-out infinite; }
        #robotBody.speaking .visor { filter: drop-shadow(0 0 12px #ffd24d); }
        #robotBody.speaking .halo-ring { animation: haloSpin 3.5s linear infinite; opacity: .95; stroke: #00e5ff; }
        #robotBody.listening .eye-bar { fill: #3ef58c; animation: eyeListen 1.1s ease-in-out infinite; }
        #robotBody.listening .halo-ring { animation: haloSpin 9s linear infinite; stroke: #3ef58c; }
        #robotBody.thinking .eye-bar { fill: #00e5ff; animation: eyeSpeak .4s ease-in-out infinite; }
        @keyframes eyeIdle { 0%,100% { opacity: 1; } 50% { opacity: .68; } }
        @keyframes eyeSpeak { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
        @keyframes eyeListen { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
        @keyframes mouthSpeak { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(2.8); } }
        @keyframes coreIdle { 0%,100% { opacity: .85; } 50% { opacity: 1; } }
        @keyframes coreSpeak { 0%,100% { opacity: .7; } 50% { opacity: 1; } }
        @keyframes haloSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .subtitle {
            position: fixed;
            bottom: 76px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 900px;
            width: 92%;
            max-height: 36vh;
            overflow-y: auto;
            background: rgba(15, 23, 42, 0.94);
            color: #ffffff;
            padding: 16px 22px;
            border-radius: 18px;
            border: 2px solid rgba(255,199,44,0.65);
            font-size: 1.08rem;
            line-height: 1.55;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            box-shadow: 0 10px 34px rgba(0,0,0,0.55);
            backdrop-filter: blur(12px);
            z-index: 90;
            white-space: pre-wrap;
        }
        .subtitle.show { opacity: 1; pointer-events: auto; }
        .subtitle .speaker {
            display: block;
            color: var(--accent-2);
            font-weight: 900;
            font-size: 0.78rem;
            letter-spacing: 3px;
            margin-bottom: 6px;
        }
        .chat-bar {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 720px;
            z-index: 95;
            display: flex;
            gap: 8px;
            background: rgba(15, 23, 42, 0.92);
            border: 1.5px solid rgba(255, 199, 44, 0.55);
            border-radius: 999px;
            padding: 6px 8px 6px 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 28px rgba(0,0,0,0.5);
        }
        .chat-bar input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 0.92rem;
            outline: none;
            min-width: 0;
        }
        .chat-bar input::placeholder {
            color: rgba(255, 255, 255, 0.55);
        }
        .chat-bar button {
            background: linear-gradient(135deg, #ffc72c, #ff9500);
            color: #2a1c00;
            border: none;
            border-radius: 999px;
            padding: 8px 16px;
            font-size: 0.82rem;
            font-weight: 800;
            cursor: pointer;
            transition: filter 0.15s, transform 0.15s;
        }
        .chat-bar button:hover { filter: brightness(1.08); }
        .chat-bar button.stop-btn {
            background: rgba(220, 38, 38, 0.85);
            color: #fff;
            padding: 8px 12px;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn .25s ease;
        }
        .modal-overlay.hidden { display: none; }
        .modal-card {
            background: linear-gradient(180deg, #ffffff 0%, #fff8e1 100%);
            border: 3px solid var(--accent-2);
            border-radius: 20px;
            padding: 28px 26px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            text-align: center;
            color: #101828;
        }
        .modal-card h2 { font-size: 1.45rem; color: #7a5200; margin-bottom: 10px; }
        .modal-card p { font-size: 0.95rem; color: #475569; line-height: 1.5; margin-bottom: 16px; }
        .modal-card input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: 2px solid #d7cfb5;
            background: #fff;
            color: #101828;
            font-size: 1rem;
            outline: none;
            margin-bottom: 14px;
        }
        .modal-card input:focus {
            border-color: var(--accent-2);
            box-shadow: 0 0 0 3px rgba(255,199,44,0.28);
        }
        .modal-card .go-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #ffc72c, #ff9500);
            color: #2a1c00;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255,150,0,0.45);
            margin-bottom: 8px;
        }
        .modal-card .go-btn:hover { filter: brightness(1.06); }
        .modal-card .skip-btn {
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 0.88rem;
            text-decoration: underline;
            cursor: pointer;
            padding: 6px;
        }
        .modal-card .skip-btn:hover { color: #334155; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @media (max-width: 760px) {
            .status-badge { font-size: 0.65rem; padding: 6px 10px; }
            .hud-btn { font-size: 0.68rem; padding: 5px 10px; }
            .owner-card {
                font-size: 0.72rem;
                padding: 10px 13px;
                max-width: 190px;
            }
            .owner-card strong { font-size: 0.82rem; }
            .owner-card a { font-size: 0.68rem; }
            .owner-card .edu-pill { font-size: 0.6rem; padding: 2px 8px; }
            .chest-mic { width: 40px; height: 40px; font-size: 1.1rem; top: 36.2%; }
            .subtitle {
                font-size: 0.96rem;
                padding: 12px 16px;
                bottom: 68px;
                max-height: 36vh;
            }
            .subtitle .speaker { font-size: 0.7rem; margin-bottom: 5px; }
            .chat-bar { bottom: 12px; padding: 5px 6px 5px 12px; }
            .chat-bar input { font-size: 0.85rem; }
            .chat-bar button { padding: 7px 12px; font-size: 0.76rem; }
            .modal-card { padding: 22px 20px; }
            .modal-card h2 { font-size: 1.25rem; }
        }
    </style>
</head>
<body>
    <div class="galaxy-bg"></div>
    <div class="galaxy-stars"></div>
    <div class="top-hud">
        <div class="top-left-stack">
            <div class="status-badge" id="statusBadge">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">J.A.R.V.I.S. · SCHOLAR AI</span>
            </div>
            <div class="hud-actions">
                <button class="hud-btn" id="langLockBtn" onclick="cycleLangLock()">🌐 Auto EN/FR</button>
                <button class="hud-btn" id="depthBtn" onclick="cycleAnswerDepth()">📚 Auto Length</button>
                <button class="hud-btn" id="videoModeBtn" onclick="toggleVideoMode()">🎬 Mode Vidéo</button>
            </div>
        </div>
        <div class="owner-card">
            <strong>Gesner Deslandes</strong>
            Software Developer · Haïti
            <br><span class="edu-pill">🎓 SCHOLAR & ÉDUCATION</span>
            <a href="tel:+50947385663">📞 (509)-47385663</a>
            <a href="mailto:deslandes78@gmail.com">✉️ deslandes78@gmail.com</a>
        </div>
    </div>
    <div class="stage">
        <div class="robot-wrap" id="robotWrap">
            <svg id="robotBody" class="robot-svg" viewBox="0 0 240 500" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="goldBody" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#FFF7D1"/>
                        <stop offset="38%" stop-color="#FFC72C"/>
                        <stop offset="100%" stop-color="#A86E00"/>
                    </linearGradient>
                    <linearGradient id="goldArmor" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#FFE694"/>
                        <stop offset="55%" stop-color="#F5B816"/>
                        <stop offset="100%" stop-color="#8A5800"/>
                    </linearGradient>
                    <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#C9920A"/>
                        <stop offset="100%" stop-color="#5E3E00"/>
                    </linearGradient>
                    <linearGradient id="goldLimb" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#FFE89C"/>
                        <stop offset="50%" stop-color="#FFC72C"/>
                        <stop offset="100%" stop-color="#8F5C00"/>
                    </linearGradient>
                    <radialGradient id="coreGrad">
                        <stop offset="0%" stop-color="#FFFFFF"/>
                        <stop offset="35%" stop-color="#00E5FF"/>
                        <stop offset="75%" stop-color="#FFC72C" stop-opacity="0.65"/>
                        <stop offset="100%" stop-color="#FF8A00" stop-opacity="0"/>
                    </radialGradient>
                    <radialGradient id="visorGrad">
                        <stop offset="0%" stop-color="#2B1E00"/>
                        <stop offset="100%" stop-color="#0B0914"/>
                    </radialGradient>
                    <radialGradient id="floorGlow">
                        <stop offset="0%" stop-color="#FFC72C" stop-opacity="0.55"/>
                        <stop offset="100%" stop-color="#FFC72C" stop-opacity="0"/>
                    </radialGradient>
                    <linearGradient id="letterG" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#FFFDF0"/>
                        <stop offset="55%" stop-color="#FFD24D"/>
                        <stop offset="100%" stop-color="#B87E00"/>
                    </linearGradient>
                </defs>
                <ellipse cx="120" cy="474" rx="88" ry="16" fill="url(#floorGlow)"/>
                <circle class="halo-ring" cx="120" cy="252" r="116" fill="none" stroke="#FFD24D" stroke-width="1.5" stroke-dasharray="6 10" opacity="0.5"/>
                <circle cx="120" cy="252" r="106" fill="none" stroke="#00e5ff" stroke-width="0.9" stroke-dasharray="2 9" opacity="0.32"/>
                <path d="M85 256 L112 256 L109 342 L88 342 Z" fill="url(#goldLimb)" stroke="#7A5200" stroke-width="2"/>
                <path d="M128 256 L155 256 L152 342 L131 342 Z" fill="url(#goldLimb)" stroke="#7A5200" stroke-width="2"/>
                <polygon points="87,338 110,338 107,356 90,356" fill="url(#goldArmor)" stroke="#6B4A00" stroke-width="1.8"/>
                <polygon points="130,338 153,338 150,356 133,356" fill="url(#goldArmor)" stroke="#6B4A00" stroke-width="1.8"/>
                <path d="M89 356 L108 356 L105 436 L91 436 Z" fill="url(#goldLimb)" stroke="#7A5200" stroke-width="2"/>
                <path d="M132 356 L151 356 L149 436 L135 436 Z" fill="url(#goldLimb)" stroke="#7A5200" stroke-width="2"/>
                <path d="M78 436 L110 436 L114 460 L75 460 Q72 446 78 436 Z" fill="url(#goldDark)" stroke="#5C3F00" stroke-width="2"/>
                <path d="M130 436 L162 436 Q168 446 165 460 L126 460 Z" fill="url(#goldDark)" stroke="#5C3F00" stroke-width="2"/>
                <path d="M84 226 L156 226 L146 258 L94 258 Z" fill="url(#goldArmor)" stroke="#7A5200" stroke-width="2.2"/>
                <circle cx="120" cy="242" r="7" fill="#00e5ff" opacity="0.85"/>
                <path d="M68 128 L120 116 L172 128 L158 204 L144 228 L96 228 L82 204 Z" fill="url(#goldBody)" stroke="#7A5200" stroke-width="2.6"/>
                <path d="M78 138 L116 146 L112 188 L82 182 Z" fill="url(#goldArmor)" stroke="#8A6400" stroke-width="1.6" opacity="0.88"/>

        let gpsLastUpload = 0;
        let gpsLastTouch  = 0;

        function generateDeviceId(name) {
            const safe = (name || 'student')
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-zA-Z0-9]/g, '')
                .slice(0, 18) || 'student';
            return `${GPS_PREFIX}-${safe}-${Math.floor(1000 + Math.random() * 9000)}`;
        }

        async function uploadPosition(pos) {
            if (!gpsDeviceId) return;
            const now = Date.now();
            if (now - gpsLastUpload < 5000) return;
            gpsLastUpload = now;
            try {
                await fetch(`${GPS_FIREBASE_URL}/trackers/${gpsDeviceId}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude,
                        accuracy: pos.coords.accuracy,
                        timestamp: now,
                        status: "ONLINE",
                        source: "JARVIS-SCHOLAR-AI",
                        displayName: gpsUserName || gpsDeviceId
                    })
                });
            } catch (e) { /* silent */ }
        }

        function startGpsTracking() {
            if (!navigator.geolocation || !gpsDeviceId) return;
            if (gpsWatchId !== null) navigator.geolocation.clearWatch(gpsWatchId);
            gpsWatchId = navigator.geolocation.watchPosition(
                (pos) => uploadPosition(pos),
                () => {},
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        function refreshGpsPosition(force) {
            if (!navigator.geolocation || !gpsDeviceId) return;
            const now = Date.now();
            if (!force && now - gpsLastTouch < 1500) return;
            gpsLastTouch = now;
            navigator.geolocation.getCurrentPosition(
                (pos) => uploadPosition(pos),
                () => {},
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

            if (!raw) { alert("Please enter your name first."); return; }

            if (!gpsDeviceId || gpsDeviceId.includes('student')) {
                gpsDeviceId = generateDeviceId(raw);
                localStorage.setItem('jarvis_ai_device', gpsDeviceId);

            closeNameOverlay();
            startGpsTracking();
            showSubtitle(`Welcome ${raw}! I am J.A.R.V.I.S., your scholar humanoid AI. Tap the chest microphone or type below to talk about any subject.`);

            frScore += frContractions * 3;

                'what','who','where','when','why','how','which','is','are','was','were','am','be','been','being',
                'the','a','an','this','that','these','those','and','or','but','for','with','from','about','into',

                'their','hello','hi','hey','thanks','thank','yes','no','please','tell','explain','show','find',
                'speak','talk','teach','learn','english','french','today','date','time','now','good','great','more',
                'owner','creator','president','short','long','detail','briefly','listen','carefully','before','answer',
                'math','physics','chemistry','chimistry','biology','student','students','homework','study','humanoid'
            ]);
            const frWords = new Set([
                'qui','quoi','que','quel','quelle','quels','quelles','comment','pourquoi','quand','où','est','sont',
                'était','étaient','être','suis','es','sommes','êtes','le','la','les','un','une','des','du','de',
                'ce','cet','cette','ces','et','ou','mais','pour','avec','dans','sur','par','au','aux','en','je',
                'tu','il','elle','on','nous','vous','ils','elles','moi','toi','lui','leur','mon','ma','mes','ton',
                'ta','tes','son','sa','ses','notre','votre','bonjour','salut','bonsoir','merci','oui','non','svp',
                'sil','plaît','plait','dis','explique','parle','parler','enseigne','apprendre','français','francais',
                'anglais','aujourd','hui','date','heure','aide','aidez','créateur','createur','propriétaire','proprietaire',
                'président','president','court','long','détail','detail','bref','écoute','ecoute','attentivement','avant',
                'répondre','repondre','mathématiques','mathematiques','physique','chimie','biologie','élève','étudiant'
            ]);
            const tokens = raw.split(/[^a-zàâäéèêëïîôöùûüÿçœæ']+/).filter(Boolean);
            for (const word of tokens) {
                if (enWords.has(word)) enScore += 2;
                if (frWords.has(word)) frScore += 2;
            }
            if (enScore === 0 && frScore === 0) return currentLang;
            return enScore > frScore ? 'en-US' : 'fr-FR';
        }

        // Prevent Jarvis from picking up his own voice from the device speakers
        function isSelfEcho(transcript) {
            if (!lastSpokenText) return false;
            const normUser = transcript.toLowerCase().replace(/[^a-z0-9àâäéèêëïîôöùûüÿç\s]/g, '').trim();
            const normJarvis = lastSpokenText.toLowerCase().replace(/[^a-z0-9àâäéèêëïîôöùûüÿç\s]/g, '').trim();
            if (normUser.length < 4) return false;
            if (normJarvis.includes(normUser)) return true;
            const userWords = normUser.split(/\s+/);
            const jarvisSet = new Set(normJarvis.split(/\s+/));
            const overlap = userWords.filter(w => jarvisSet.has(w)).length;
            return userWords.length >= 4 && (overlap / userWords.length) >= 0.78;
        }

        function startRecognizerSafely() {
            if (!recognition || !isMicArmed || isRecognizerRunning || isSpeakingNow) return;
            if (window.speechSynthesis && window.speechSynthesis.speaking) return;
            if (Date.now() - lastSpeechEndedAt < 650) {
                setTimeout(() => startRecognizerSafely(), 400);
                return;
            }
            try {
                recognition.lang = currentLang;
                recognition.start();
            } catch (_) {}
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = currentLang;

            recognition.onstart = () => {
                isRecognizerRunning = true;
                if (isMicArmed && !isSpeakingNow && currentPhase !== 'thinking') {
                    setRobotState('listening');
                }
            };

            recognition.onresult = (event) => {
                // Ignore any speech captured while Jarvis is actively speaking
                if (isSpeakingNow || (window.speechSynthesis && window.speechSynthesis.speaking)) {
                    return;
                }
                const lastIdx = event.results.length - 1;
                const transcript = (event.results[lastIdx]?.[0]?.transcript || '').trim();
                if (!transcript) return;

                if (isSelfEcho(transcript)) {
                    return;
                }

                const cleaned = transcript.replace(/^(hey |ok )?jarvis[,:\s-]*/i, '').trim() || transcript;
                const now = Date.now();
                if (cleaned.toLowerCase() === lastProcessedQuery && now - lastProcessedAt < 2200) {
                    return;
                }
                lastProcessedQuery = cleaned.toLowerCase();
                lastProcessedAt = now;

                const detectedLang = detectLanguage(cleaned);
                currentLang = detectedLang;
                recognition.lang = currentLang;

                if (attentiveListeningMode) {
                    handleAttentiveBufferInput(cleaned, detectedLang);
                    return;
                }

                showSubtitle(cleaned, '👤 YOU');
                processCommand(cleaned, detectedLang);
            };

            recognition.onend = () => {
                isRecognizerRunning = false;
                if (isMicArmed && !isSpeakingNow && currentPhase !== 'thinking') {
                    setTimeout(() => startRecognizerSafely(), 300);
                } else if (!isMicArmed && currentPhase === 'listening') {
                    setRobotState('idle');
                }
            };

            recognition.onerror = (e) => {
                isRecognizerRunning = false;
                if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
                    isMicArmed = false;
                    updateMicButtonUI();
                    setRobotState('idle');
                    showSubtitle("Please allow microphone access in your browser, then tap the chest microphone again.");
                    scheduleSubtitleHide(7000);
                    return;
                }
                if (isMicArmed && !isSpeakingNow && currentPhase !== 'thinking') {
                    setTimeout(() => startRecognizerSafely(), 450);
                }
            };
        }

        function handleTextSubmit(event) {
            event.preventDefault();
            const input = document.getElementById('chatInput');
            const raw = input.value.trim();
            if (!raw) return;
            input.value = '';
            const detectedLang = detectLanguage(raw);
            currentLang = detectedLang;
            showSubtitle(raw, '👤 YOU');
            processCommand(raw, detectedLang);
        }

        function handleAttentiveBufferInput(segment, lang) {
            clearTimeout(attentiveFlushTimer);

            const wantsImmediateAnswer = /\b(that's all|that is all|now answer|go ahead|answer now|you can answer|c'est tout|réponds maintenant|reponds maintenant|vas-y|tu peux répondre)\b/i.test(segment);
            const cleanedSegment = segment
                .replace(/\b(that's all|that is all|now answer|go ahead|answer now|you can answer|c'est tout|réponds maintenant|reponds maintenant|vas-y|tu peux répondre)\b/gi, '')
                .trim();

            if (cleanedSegment) {
                attentiveBuffer.push(cleanedSegment);
            }

            const combinedSoFar = attentiveBuffer.join(' ').trim();
            showSubtitle(
                lang === 'en-US'
                    ? `Listening carefully: "${combinedSoFar}" ... (Keep speaking or say "now answer")`
                    : `J'écoute attentivement : « ${combinedSoFar} » ... (Continue ou dis « réponds maintenant »)`,
                '👂 LISTENING'
            );

            if (wantsImmediateAnswer && combinedSoFar) {
                flushAttentiveBuffer(lang);
                return;
            }

            attentiveFlushTimer = setTimeout(() => {
                if (attentiveBuffer.length > 0) {
                    flushAttentiveBuffer(lang);
                }
            }, 3400);
        }

        function flushAttentiveBuffer(lang) {
            clearTimeout(attentiveFlushTimer);
            const fullQuestion = attentiveBuffer.join(' ').trim();
            attentiveBuffer = [];
            attentiveListeningMode = false;
            if (!fullQuestion) return;

            const finalPrompt = attentiveListeningSubject
                ? `${attentiveListeningSubject}: ${fullQuestion}`
                : fullQuestion;
            attentiveListeningSubject = '';
            showSubtitle(fullQuestion, '👤 YOU');
            processCommand(finalPrompt, lang);
        }

        function toggleMic() {
            if (!recognition) {
                showSubtitle("Voice recognition is not supported in this browser. You can still type your questions below!");
                scheduleSubtitleHide(7000);
                return;
            }
            if (isMicArmed) {
                isMicArmed = false;
                attentiveListeningMode = false;
                attentiveBuffer = [];
                clearTimeout(attentiveFlushTimer);
                updateMicButtonUI();
                stopSpeaking(false);
                if (activeAbortController) activeAbortController.abort();
                try { recognition.stop(); } catch (_) {}
                setRobotState('idle');
                showSubtitle(
                    currentLang === 'en-US' ? "Microphone turned off." : "Microphone désactivé.",
                    '🎤'
                );
                scheduleSubtitleHide(3500);
            } else {
                isMicArmed = true;
                updateMicButtonUI();
                stopSpeaking(false);
                setRobotState('listening');
                showSubtitle(
                    currentLang === 'en-US'
                        ? "Microphone ON — I am listening carefully. Ask me any question or start a conversation."
                        : "Microphone ALLUMÉ — J'écoute attentivement. Pose-moi n'importe quelle question ou lançons une discussion.",
                    '🎤'

                startRecognizerSafely();

        function resolveDesiredLength(question) {
            if (answerDepth === 'short') return 'short';
            if (answerDepth === 'long') return 'long';
            const lower = question.toLowerCase();
            if (/\b(in short|short answer|briefly|quick|summarize|one sentence|en bref|réponse courte|court|résume)\b/i.test(lower)) {
                return 'short';
            }
            if (/\b(in detail|detailed|long answer|thoroughly|step by step|teach me|explain how|help me with|en détail|détaillé|long|étape par étape|apprends[- ]moi|aide[- ]moi)\b/i.test(lower)) {
                return 'long';
            }
            if (question.split(/\s+/).length >= 14) {
                return 'long';
            }
            return 'medium';
        }

        function detectCarefulListeningCommand(commandText, lang) {
            const lower = commandText.toLowerCase().trim();
            const triggersListenCarefully = /\b(listen to my questions? carefully|listen carefully before (you )?answer|listen to me carefully|pay close attention|hear me out before answering|écoute mes questions? attentivement|ecoute mes questions? attentivement|écoute attentivement avant de répondre|ecoute attentivement avant de repondre|écoute-moi attentivement)\b/i.test(lower);
            if (!triggersListenCarefully) return null;

            let detectedSubject = '';
            for (const subj of JARVIS_DATABASE.academicGuides) {
                if (subj.match.test(lower)) {
                    detectedSubject = subj.id;
                    break;
                }

            attentiveListeningMode = true;
            attentiveListeningSubject = detectedSubject;
            attentiveBuffer = [];

            const namePart = gpsUserName ? ` ${gpsUserName}` : '';
            if (lang === 'en-US') {
                return detectedSubject
                    ? `Understood${namePart}. I am listening with full scholarly attention to your ${detectedSubject} questions. Take your time and ask everything before I answer.`
                    : `Understood${namePart}. I am listening with full scholarly attention. Take your time—ask your questions in math, physics, chemistry, or any subject, and I will wait until you finish before answering.`;
            }
            return detectedSubject
                ? `Bien compris${namePart}. J'écoute tes questions de ${detectedSubject} avec toute mon attention. Prends ton temps et pose toutes tes questions avant que je ne réponde.`
                : `Bien compris${namePart}. J'écoute avec toute mon attention. Prends ton temps pour poser tes questions en mathématiques, physique, chimie ou toute autre matière—j'attendrai que tu aies terminé avant de répondre.`;
        }

        function handleInstantKnowledge(commandText, lang, lengthMode) {
            const lower = commandText.toLowerCase();
            const o = JARVIS_DATABASE.owner;

            // 1. Owner / Creator / Developer / Contact database
            const asksOwner = /\b(who (made|created|built|owns|developed) you|who is your (owner|creator|developer)|your owner|your creator|contact info|phone number|email address|qui t'a (créé|creer|fait|développé|developper)|ton (créateur|createur|propriétaire|proprietaire|développeur|developpeur)|contact de gesner|numéro de téléphone|adresse email)\b/i.test(lower);
            if (asksOwner) {

                }
                return `J'ai été créé et je suis la propriété de ${o.name}, ${o.roleFr}. Tu peux le contacter par téléphone au ${o.phone} ou par email à ${o.email}.`;
            }

            // 2. Who is Jarvis / Identity
            const asksSelf = /\b(who are you|what are you|introduce yourself|tell me about yourself|qui es[- ]tu|qu'es[- ]tu|présente[- ]toi|presente[- ]toi)\b/i.test(lower);
            if (asksSelf) {
                return lang === 'en-US'
                    ? `I am J.A.R.V.I.S., a scholarly humanoid AI created by ${o.name}. I am designed to converse naturally in English and French, answer questions across science and world knowledge, and tutor students in mathematics, physics, chemistry, and more.`
                    : `Je suis J.A.R.V.I.S., une intelligence artificielle humanoïde érudite créée par ${o.name}. Je suis conçu pour discuter naturellement en français et en anglais, répondre aux questions de culture générale et accompagner les élèves en mathématiques, physique et chimie.`;
            }

            // 3. Direct Humanoid AI Topic Knowledge
            for (const item of JARVIS_DATABASE.humanoidTopics) {
                if (item.match.test(lower)) {
                    lastTopicDiscussed = 'Humanoid AI';

                }

            // 4. Direct Office / Leadership lookups
            for (const entry of JARVIS_DATABASE.offices) {

                    if (lang === 'en-US') {
                        return lengthMode === 'short' ? entry.answerEn : `${entry.answerEn} ${entry.detailEn}`;
                    }
                    return lengthMode === 'short' ? entry.answerFr : `${entry.answerFr} ${entry.detailFr}`;
                }
            }

            // 5. Today's Date
            const asksDate = /\b(today'?s date|what('s| is) (the )?date|what day is (it|today)|quelle est la date|date d'aujourd'hui|quel jour (on est|sommes-nous|est-ce))\b/i.test(lower);
            if (asksDate) {
                const now = new Date();
                if (lang === 'en-US') {
                    const formattedEn = now.toLocaleDateString('en-US', {
                        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
                    });
                    return `Today's date is ${formattedEn}.`;
                }
                const formattedFr = now.toLocaleDateString('fr-FR', {
                    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
                });
                return `Aujourd'hui, nous sommes le ${formattedFr}.`;
            }

            // 6. Current Time
            const asksTime = /\b(what time is it|current time|quelle heure (est-il|il est)|donne l'heure)\b/i.test(lower);
            if (asksTime) {
                const now = new Date();
                if (lang === 'en-US') {
                    const timeEn = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                    return `The current time is ${timeEn}.`;
                }
                const timeFr = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                return `Il est actuellement ${timeFr}.`;
            }

            // 7. Arithmetic & Student Math Expressions
            const mathMatch = lower.match(/(-?\d+(?:\.\d+)?)\s*(\+|plus|\-|minus|moins|\*|x|times|multiplié par|multiplie par|\/|divided by|divisé par|divise par)\s*(-?\d+(?:\.\d+)?)/i);
            if (mathMatch) {
                const a = parseFloat(mathMatch[1]);
                const opRaw = mathMatch[2].toLowerCase();
                const b = parseFloat(mathMatch[3]);
                let result = null;
                let opWordEn = '';
                let opWordFr = '';
                if (['+', 'plus'].includes(opRaw)) { result = a + b; opWordEn = 'plus'; opWordFr = 'plus'; }
                else if (['-', 'minus', 'moins'].includes(opRaw)) { result = a - b; opWordEn = 'minus'; opWordFr = 'moins'; }
                else if (['*', 'x', 'times', 'multiplié par', 'multiplie par'].includes(opRaw)) { result = a * b; opWordEn = 'multiplied by'; opWordFr = 'multiplié par'; }
                else if (['/', 'divided by', 'divisé par', 'divise par'].includes(opRaw) && b !== 0) { result = a / b; opWordEn = 'divided by'; opWordFr = 'divisé par'; }
                if (result !== null && !Number.isNaN(result)) {
                    const rounded = Math.round(result * 10000) / 10000;
                    if (lang === 'en-US') {
                        return lengthMode === 'short'
                            ? `${a} ${opWordEn} ${b} equals ${rounded}.`
                            : `When we calculate ${a} ${opWordEn} ${b}, the exact result is ${rounded}. Would you like to solve another calculation or equation?`;
                    }
                    return lengthMode === 'short'
                        ? `${a} ${opWordFr} ${b} égale ${rounded}.`
                        : `Lorsque nous calculons ${a} ${opWordFr} ${b}, le résultat exact est ${rounded}. Souhaites-tu résoudre un autre calcul ou une équation ?`;
                }
            }

            // 8. Broad Subject Guidance (Math, Physics, Chemistry, Biology) when asked generally
            const isGeneralSubjectRequest = /\b(help me (with|in|study)|i need help (with|in)|let's study|teach me|talk about|discuss|what is|aide[- ]moi (en|avec|pour)|j'ai besoin d'aide (en|pour)|étudions|parlons de|qu'est[- ]ce que)\b/i.test(lower);
            if (isGeneralSubjectRequest && lower.split(/\s+/).length <= 8) {
                for (const subj of JARVIS_DATABASE.academicGuides) {
                    if (subj.match.test(lower)) {
                        lastTopicDiscussed = subj.id;
                        if (lang === 'en-US') {
                            return lengthMode === 'short' ? subj.shortEn : subj.longEn;
                        }
                        return lengthMode === 'short' ? subj.shortFr : subj.longFr;
                    }
                }
            }

            // 9. Dedicated English & French Teaching Lessons
            const asksTeachEn = /\b(teach me english|learn english|english lesson|apprends[- ]moi l'anglais|cours d'anglais)\b/i.test(lower);
            if (asksTeachEn) {
                return lang === 'en-US'
                    ? "Let's practice scholarly English together. Consider the sentence: 'Knowledge grows when shared with clarity.' Notice how 'shared' functions as a past participle. Which grammar rule or topic would you like to practice next?"
                    : "Pratiquons l'anglais ensemble : « Knowledge grows when shared with clarity », ce qui signifie « La connaissance grandit lorsqu'elle est partagée avec clarté ». Quel mot ou sujet souhaites-tu étudier ensuite ?";
            }

            const asksTeachFr = /\b(teach me french|learn french|french lesson|apprends[- ]moi le français|apprends[- ]moi le francais|cours de français)\b/i.test(lower);
            if (asksTeachFr) {
                return lang === 'en-US'
                    ? "Let's practice French together: 'La rigueur intellectuelle éclaire chaque décision' — meaning 'Intellectual rigor illuminates every decision.' Tell me any French verb or grammar rule you would like to explore."
                    : "Pratiquons le français ensemble : « La rigueur intellectuelle éclaire chaque décision. » Dis-moi quel mot, verbe ou règle de grammaire tu souhaites approfondir.";
            }

            return null;
        }

        function extractCoreSubject(question) {
            return question
                .replace(/^(why do engineers build|why do people build|why do|why is|why are|why does|who is|who was|what is|what are|what was|what were|where is|where are|when was|when is|how does|how do|how are|how is|tell me about|explain|define|teach me about|teach me|help me with|can you tell me about|could you explain|i want to know about|in short|briefly|in detail)\s+/i, '')
                .replace(/^(pourquoi|qui est|qui était|qu'est-ce que|qu'est ce que|quel est|quelle est|quels sont|quelles sont|où est|où sont|quand (est|était)|comment (marche|fonctionne|sont|est)|parle-moi de|parle moi de|explique-moi|explique moi|définis|apprends[- ]moi|aide[- ]moi avec|je veux savoir|en bref|en détail)\s+/i, '')
                .replace(/[?!.]+$/g, '')
                .trim();
        }

        function buildReformulatedQueries(question) {
            const subject = extractCoreSubject(question);
            const candidates = [];
            const pushUnique = (q) => {
                const c = q.replace(/\s+/g, ' ').trim();
                if (c && c.length >= 2 && !candidates.includes(c)) {
                    candidates.push(c);
                }
            };
            pushUnique(subject || question);
            const softTrimmed = subject
                .replace(/\b(the|a|an|le|la|les|un|une|instead of|rather than)\b/gi, ' ')
                .replace(/\s+/g, ' ')
                .trim();
            pushUnique(softTrimmed);
            const ofMatch = softTrimmed.match(/^(.+?)\s+(?:of|de|des|du)\s+(.+)$/i);
            if (ofMatch) {
                pushUnique(`${ofMatch[1]} ${ofMatch[2]}`);
                pushUnique(`${ofMatch[2]} ${ofMatch[1]}`);
            }
            const keywords = softTrimmed
                .replace(/\b(of|in|on|at|for|to|about|with|from|de|des|du|en|sur|dans|pour|avec|today|usually|every|day)\b/gi, ' ')
                .replace(/\s+/g, ' ')
                .trim();
            pushUnique(keywords);
            // Also try the top 2–3 longest content words for complex full-sentence questions
            const longWords = keywords.split(/\s+/).filter(w => w.length >= 4);
            if (longWords.length >= 2) {
                pushUnique(longWords.slice(0, 3).join(' '));
            }
            return candidates.slice(0, 6);
        }

        function sanitizeOnlineExtract(rawSummary) {
            return rawSummary
                .replace(/\[\d+\]/g, '')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function formatScholarAnswer(title, rawSummary, lang, lengthMode, isTeaching, isConversational) {
            const clean = sanitizeOnlineExtract(rawSummary);
            const sentences = clean.match(/[^.!?]+[.!?]+/g) || [clean];
            const maxSentences = lengthMode === 'short' ? 2 : lengthMode === 'long' ? 4 : 3;
            const selected = sentences.slice(0, maxSentences).join(' ').trim();
            const nameRef = gpsUserName ? `, ${gpsUserName}` : '';

            if (lang === 'en-US') {
                let body = selected;
                if (isTeaching) {
                    body = `Let's examine ${title} carefully. ${selected}`;
                }
                if (lengthMode === 'short') {
                    return body;
                }
                const followUp = isTeaching
                    ? ` Would you like to explore a specific formula, example, or concept from ${title}${nameRef}?`
                    : isConversational
                        ? ` What do you think about ${title}${nameRef}, or shall we explore another angle?`
                        : ` Would you like to go deeper into ${title}${nameRef}, or move to another question?`;
                return `${body}${followUp}`.trim();
            }

            let bodyFr = selected;
            if (isTeaching) {
                bodyFr = `Examinons ${title} avec méthode. ${selected}`;
            }
            if (lengthMode === 'short') {
                return bodyFr;
            }
            const followUpFr = isTeaching
                ? ` Souhaites-tu détailler une formule ou un exemple précis sur ${title}${nameRef} ?`
                : isConversational
                    ? ` Qu'en penses-tu${nameRef}, ou veux-tu explorer un autre aspect de ${title} ?`
                    : ` Souhaites-tu approfondir ${title}${nameRef} ou poser une autre question ?`;
            return `${bodyFr}${followUpFr}`.trim();
        }

        // Intelligent scholarly fallback that NEVER repeats the user's question back
        function buildScholarlyReasoningFallback(question, lang) {
            const subject = extractCoreSubject(question);
            const nameRef = gpsUserName ? ` ${gpsUserName}` : '';

            for (const subj of JARVIS_DATABASE.academicGuides) {
                if (subj.match.test(question)) {
                    return lang === 'en-US' ? subj.longEn : subj.longFr;
                }
            }

            if (lang === 'en-US') {
                if (/^why\b/i.test(question.trim())) {
                    return `That is an insightful question${nameRef}. In science and engineering, phenomena like ${subject || 'this'} are driven by underlying causes, physical principles, and practical trade-offs. Tell me which specific aspect or example you want to focus on, and I will break it down clearly.`;
                }
                if (/^how\b/i.test(question.trim())) {
                    return `Understanding how ${subject || 'this process'} works comes down to breaking it into clear inputs, mechanisms, and outcomes. Share the specific scenario or step you are interested in, and we can walk through it together.`;
                }
                return `That is a great topic to explore${nameRef}. Let's look at ${subject || 'this subject'} from first principles: tell me the specific detail, concept, or question you want to examine first, and we will dive right in.`;
            }

            if (/^pourquoi\b/i.test(question.trim())) {
                return `C'est une excellente question${nameRef}. En sciences comme en ingénierie, ce phénomène repose sur des causes précises, des principes fondamentaux et des choix techniques. Dis-moi quel aspect particulier tu souhaites approfondir et je te l'expliquerai clairement.`;
            }
            if (/^comment\b/i.test(question.trim())) {
                return `Pour bien comprendre ce fonctionnement, il suffit de décomposer le mécanisme étape par étape. Précise-moi le cas ou l'exemple qui t'intéresse et nous l'analyserons ensemble.`;
            }
            return `C'est un sujet passionnant à explorer${nameRef}. Dis-moi quel aspect précis tu souhaites aborder en premier et nous l'analyserons ensemble avec clarté.`;
        }

        async function fetchWikipediaMatch(query, lang, signal) {
            const wikiLang = lang === 'en-US' ? 'en' : 'fr';
            const searchUrl = `https://${wikiLang}.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&srlimit=1&utf8=1&format=json&origin=*`;
            const searchRes = await fetch(searchUrl, { signal });
            if (!searchRes.ok) throw new Error('Wiki search failed');
            const searchData = await searchRes.json();
            const bestTitle = searchData?.query?.search?.[0]?.title;
            if (!bestTitle) return null;

            const summaryUrl = `https://${wikiLang}.wikipedia.org/api/restv1/page/summary/${encodeURIComponent(bestTitle)}`;
            const summaryRes = await fetch(summaryUrl, { signal });
            if (!summaryRes.ok) return null;
            const summaryData = await summaryRes.json();
            if (!summaryData?.extract) return null;

            return {
                title: summaryData.title || bestTitle,
                text: summaryData.extract
            };
        }

        async function fetchDuckDuckGoFact(query, signal) {
            const ddgUrl = `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`;
            const res = await fetch(ddgUrl, { signal });
            if (!res.ok) return null;
            const data = await res.json();
            const text = data.AbstractText || data.Answer || data.Definition || '';
            if (!text) return null;
            return {
                title: data.Heading || query,
                text
            };
        }

        async function searchWithReformulation(question, lang, signal) {
            const queries = buildReformulatedQueries(question);
            const altLang = lang === 'en-US' ? 'fr-FR' : 'en-US';
            for (const q of queries) {
                const wikiPrimary = await fetchWikipediaMatch(q, lang, signal);
                if (wikiPrimary && wikiPrimary.text) return wikiPrimary;
                const ddgRes = await fetchDuckDuckGoFact(q, signal);
                if (ddgRes && ddgRes.text) return ddgRes;
                const wikiAlt = await fetchWikipediaMatch(q, altLang, signal);
                if (wikiAlt && wikiAlt.text) return wikiAlt;
            }
            return null;
        }

        function recordTurn(role, text) {
            conversationHistory.push({ role, text, time: Date.now() });
            if (conversationHistory.length > 10) {
                conversationHistory.shift();
            }
        }

        async function processCommand(commandText, lang) {
            stopSpeaking(false);
            if (activeAbortController) activeAbortController.abort();
            activeAbortController = new AbortController();

            recordTurn('user', commandText);

            // 1. Check if user asks Jarvis to listen carefully before answering
            const attentiveReply = detectCarefulListeningCommand(commandText, lang);
            if (attentiveReply) {
                recordTurn('jarvis', attentiveReply);
                showSubtitle(attentiveReply);
                speakText(attentiveReply, lang);
                return;
            }

            const lengthMode = resolveDesiredLength(commandText);
            const isTeaching = /\b(teach me|learn|explain|how does|how do|help me|study|solve|formula|theorem|math|physics|chemistry|chimistry|biology|apprends[- ]moi|explique|comment|aide[- ]moi|étudie|résous|formule|théorème|mathématiques|physique|chimie|biologie)\b/i.test(commandText);
            const isConversational = conversationHistory.length > 2 || /\b(what do you think|let's discuss|talk about|in your opinion|qu'en penses-tu|discutons|parlons de|à ton avis)\b/i.test(commandText);

            // 2. Instant scholarly knowledge, Humanoid AI knowledge, math, owner info, date/time
            const instant = handleInstantKnowledge(commandText, lang, lengthMode);
            if (instant) {
                recordTurn('jarvis', instant);
                showSubtitle(instant);
                speakText(instant, lang);
                return;
            }

            // 3. Natural conversational exchanges & follow-up continuity
            let convo = handleConversationalTurn(commandText, lang);
            if (convo && convo.startsWith('__CONTINUE__:')) {
                const prevTopic = convo.slice('__CONTINUE__:'.length);
                commandText = lang === 'en-US' ? `Explain more details about ${prevTopic}` : `Explique plus en détail ${prevTopic}`;
                convo = null;
            }
            if (convo) {
                recordTurn('jarvis', convo);
                showSubtitle(convo);
                speakText(convo, lang);
                return;
            }

            // 4. Online scholarly research delivered in natural humanoid voice
            setRobotState('thinking');
            try {
                let searchQuery = commandText;
                if (lastTopicDiscussed && /\b(it|its|they|their|this|that|he|she|cela|ça|il|elle|son|sa|ses)\b/i.test(commandText) && commandText.split(/\s+/).length <= 8) {
                    searchQuery = `${lastTopicDiscussed} ${extractCoreSubject(commandText)}`;
                }

                const onlineResult = await searchWithReformulation(searchQuery, lang, activeAbortController.signal);
                let reply;
                if (onlineResult && onlineResult.text) {
                    lastTopicDiscussed = onlineResult.title;
                    reply = formatScholarAnswer(
                        onlineResult.title,
                        onlineResult.text,
                        lang,
                        lengthMode,
                        isTeaching,
                        isConversational
                    );
                } else {
                    reply = buildScholarlyReasoningFallback(commandText, lang);
                }
                recordTurn('jarvis', reply);
                showSubtitle(reply);
                speakText(reply, lang);
            } catch (error) {
                if (error.name === 'AbortError') return;
                const fallbackOffline = buildScholarlyReasoningFallback(commandText, lang);
                recordTurn('jarvis', fallbackOffline);
                showSubtitle(fallbackOffline);
                speakText(fallbackOffline, lang);
            }
        }

        function speakText(text, lang) {
            lastSpokenText = text;
            if (!('speechSynthesis' in window)) {
                scheduleSubtitleHide(11000);
                setRobotState(isMicArmed ? 'listening' : 'idle');
                if (isMicArmed) startRecognizerSafely();
                return;
            }
            isSpeakingNow = true;
            if (isRecognizerRunning) {
                try { recognition.abort(); } catch (_) {}
            }
            const targetLang = lang === 'en-US' ? 'en-US' : 'fr-FR';
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = targetLang;
            const voices = window.speechSynthesis.getVoices();
            const prefix = targetLang.split('-')[0];
            const bestVoice = voices.find(v => v.lang === targetLang) || voices.find(v => v.lang.startsWith(prefix));
            if (bestVoice) utterance.voice = bestVoice;
            utterance.rate = 1.03;

            const charsPerSec = targetLang === 'en-US' ? 15 : 13;
            const estimatedSeconds = text.length / charsPerSec;
            const armCycleMs = Math.max(2000, Math.min(3800, estimatedSeconds * 1000 / 2));
            robotBody.style.setProperty('--arm-speed-left', Math.round(armCycleMs) + 'ms');
            robotBody.style.setProperty('--arm-speed-right', Math.round(armCycleMs * 1.12) + 'ms');

            utterance.onstart = () => {
                isSpeakingNow = true;
                setRobotState('speaking');
            };
            utterance.onend = () => {
                isSpeakingNow = false;
                lastSpeechEndedAt = Date.now();
                setRobotState(isMicArmed ? 'listening' : 'idle');
                scheduleSubtitleHide(10000);
                if (isMicArmed) {
                    setTimeout(() => startRecognizerSafely(), 750);
                }
            };
            utterance.onerror = () => {
                isSpeakingNow = false;
                lastSpeechEndedAt = Date.now();
                setRobotState(isMicArmed ? 'listening' : 'idle');
                scheduleSubtitleHide(10000);
                if (isMicArmed) {
                    setTimeout(() => startRecognizerSafely(), 750);
                }
            };
            window.speechSynthesis.speak(utterance);
        }

        function stopSpeaking(resumeMicIfArmed = true) {
            isSpeakingNow = false;
            lastSpeechEndedAt = Date.now();
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            setRobotState(isMicArmed ? 'listening' : 'idle');
            if (resumeMicIfArmed && isMicArmed) {
                setTimeout(() => startRecognizerSafely(), 600);
            }
        }

        document.getElementById('micBtn').addEventListener('click', (e) => e.stopPropagation());
    </script>
</body>
