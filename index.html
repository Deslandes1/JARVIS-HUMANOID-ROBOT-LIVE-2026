<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - Scholar Humanoid AI</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        :root {
            --accent: #b8860b;
            --accent-2: #ffc72c;
            --cyan: #00e5ff;
            --danger: #dc2626;
            --success: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        html, body { height: 100%; }
        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #120b36;
            color: #fff;
        }
        .galaxy-bg {
            position: fixed; inset: -10%; z-index: -2;
            background:
                radial-gradient(circle at 15% 20%, #7b4bff 0%, transparent 42%),
                radial-gradient(circle at 85% 15%, #00c2ff 0%, transparent 42%),
                radial-gradient(circle at 75% 80%, #ff4fa3 0%, transparent 45%),
                radial-gradient(circle at 25% 85%, #ffc72c 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, #4b2fbf 0%, transparent 60%),
                linear-gradient(160deg, #120b36 0%, #241a6b 30%, #0e3a7a 65%, #2a0f4d 100%);
            filter: saturate(1.35) brightness(1.15);
            animation: galaxyDrift 34s ease-in-out infinite alternate;
        }
        @keyframes galaxyDrift {
            from { transform: scale(1) rotate(0deg); }
            to   { transform: scale(1.09) rotate(2.5deg); }
        }
        .galaxy-stars {
            position: fixed; inset: -30%; z-index: -1; pointer-events: none;
            background-image:
                radial-gradient(1.7px 1.7px at 20px 30px, #ffffff, transparent),
                radial-gradient(1.2px 1.2px at 120px 90px, #ffe9b0, transparent),
                radial-gradient(1.9px 1.9px at 230px 150px, #d6f2ff, transparent),
                radial-gradient(1px 1px at 60px 210px, #ffffff, transparent),
                radial-gradient(1.5px 1.5px at 180px 260px, #ffd6f2, transparent),
                radial-gradient(1px 1px at 300px 70px, #ffffff, transparent),
                radial-gradient(1.7px 1.7px at 350px 220px, #e8f6ff, transparent),
                radial-gradient(1.1px 1.1px at 400px 330px, #ffffff, transparent),
                radial-gradient(1.3px 1.3px at 90px 340px, #fff3c4, transparent),
                radial-gradient(1px 1px at 260px 380px, #ffffff, transparent);
            background-size: 430px 400px;
            background-repeat: repeat;
            animation: twinkle 5s ease-in-out infinite alternate, starDrift 120s linear infinite;
        }
        @keyframes twinkle { from { opacity: .55; } to { opacity: 1; } }
        @keyframes starDrift { from { transform: translate3d(0,0,0); } to { transform: translate3d(-70px,-45px,0); } }

        .top-hud {
            position: fixed;
            top: 14px;
            left: 14px;
            right: 14px;
            z-index: 50;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            pointer-events: none;
        }
        .top-left-stack {
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: auto;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.85);
            border: 1.5px solid rgba(255, 199, 44, 0.55);
            backdrop-filter: blur(10px);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            color: var(--accent-2);
        }
        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--accent-2);
            box-shadow: 0 0 10px var(--accent-2);
        }
        .hud-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .hud-btn {
            background: rgba(15, 23, 42, 0.85);
            color: #fff;
            border: 1px solid rgba(255, 199, 44, 0.45);
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 0.74rem;
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: transform 0.15s, border-color 0.2s, background 0.2s;
        }
        .hud-btn:hover {
            border-color: var(--accent-2);
            background: rgba(30, 41, 59, 0.95);
            transform: translateY(-1px);
        }
        .hud-btn.active {
            border-color: var(--cyan);
            color: var(--cyan);
        }

        .owner-card {
            pointer-events: auto;
            background: rgba(255,255,255,0.94);
            backdrop-filter: blur(14px);
            border: 2px solid var(--accent-2);
            border-radius: 14px;
            padding: 12px 16px;
            text-align: right;
            font-size: 0.82rem;
            color: #475569;
            line-height: 1.5;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            max-width: 255px;
        }
        .owner-card strong {
            color: var(--accent);
            font-size: 0.95rem;
            display: block;
            margin-bottom: 2px;
        }
        .owner-card .edu-pill {
            display: inline-block;
            margin: 6px 0 6px;
            font-size: 0.68rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffc72c, #ff8a00);
            color: #3b2a00;
            padding: 3px 10px;
            border-radius: 10px;
            letter-spacing: 0.5px;
        }
        .owner-card a {
            display: block;
            color: #7a5200;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.76rem;
            margin-top: 4px;
            transition: color .15s;
        }
        .owner-card a:hover { color: var(--accent); text-decoration: underline; }

        body.video-mode .owner-card {
            display: none;
        }

        .stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            min-height: 0;
            overflow: hidden;
        }
        .robot-wrap {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #robotBody {
            height: 100%;
            width: auto;
            display: block;
            filter: drop-shadow(0 12px 34px rgba(255,199,44,0.45));
            transition: filter 0.3s ease, transform 0.45s ease;
        }
        .chest-mic {
            position: absolute;
            top: 36.2%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #FFF4C2, #FFC72C 60%, #B87A00 100%);
            border: 2.5px solid #ffffff;
            color: #2a1c00;
            font-size: 1.3rem;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 18px rgba(255,199,44,0.9), inset 0 0 10px rgba(255,255,255,0.55);
            animation: micGlow 2.4s ease-in-out infinite;
            transition: transform .15s, background .2s;
        }
        .chest-mic:hover { transform: translate(-50%, -50%) scale(1.12); }
        .chest-mic:active { transform: translate(-50%, -50%) scale(0.95); }
        .chest-mic.listening {
            background: radial-gradient(circle at 30% 30%, #FFB0B0, #DC2626 60%, #7F1D1D 100%);
            color: #ffffff;
            animation: micListen 1s ease-in-out infinite;
        }
        @keyframes micGlow {
            0%, 100% { box-shadow: 0 0 18px rgba(255,199,44,0.9), inset 0 0 10px rgba(255,255,255,0.55); }
            50% { box-shadow: 0 0 32px rgba(255,199,44,1), inset 0 0 15px rgba(255,255,255,0.9); }
        }
        @keyframes micListen {
            0%, 100% { box-shadow: 0 0 22px rgba(220,38,38,0.95); }
            50% { box-shadow: 0 0 42px rgba(220,38,38,1); }
        }

        #robotBody .eye-bar { animation: eyeIdle 3.4s ease-in-out infinite; }
        #robotBody .core { animation: coreIdle 2.5s ease-in-out infinite; }
        #robotBody .halo-ring { transform-origin: 120px 250px; animation: haloSpin 36s linear infinite; }
        #robotBody .head-group { transform-box: view-box; transform-origin: 120px 104px; transition: transform 0.4s ease; }
        .arm-left, .arm-right {
            transform-box: view-box;
            transition: transform 0.5s ease-in-out;
        }
        .arm-left  { transform-origin: 58px 134px; }
        .arm-right { transform-origin: 182px 134px; }

        #robotBody:not(.speaking) .head-group { animation: headIdle 5.5s ease-in-out infinite; }
        #robotBody:not(.speaking) .arm-left  { animation: armIdleLeft 5.8s ease-in-out infinite; }
        #robotBody:not(.speaking) .arm-right { animation: armIdleRight 6.4s ease-in-out infinite; }

        #robotBody.speaking .head-group { animation: headSpeak 1.6s ease-in-out infinite; }
        #robotBody.speaking .arm-left  { animation: armSpeakLeft var(--arm-speed-left, 2400ms) ease-in-out infinite; }
        #robotBody.speaking .arm-right { animation: armSpeakRight var(--arm-speed-right, 2700ms) ease-in-out infinite; }

        @keyframes headIdle {
            0%, 100% { transform: rotate(0deg); }
            50%      { transform: rotate(2.2deg); }
        }
        @keyframes headSpeak {
            0%, 100% { transform: rotate(0deg) translateY(0); }
            50%      { transform: rotate(-2.5deg) translateY(-2px); }
        }
        @keyframes armIdleLeft {
            0%, 100% { transform: rotate(0deg); }
            50%      { transform: rotate(-3deg); }
        }
        @keyframes armIdleRight {
            0%, 100% { transform: rotate(0deg); }
            50%      { transform: rotate(3deg); }
        }
        @keyframes armSpeakLeft {
            0%   { transform: rotate(0deg); }
            30%  { transform: rotate(-16deg); }
            65%  { transform: rotate(-6deg); }
            100% { transform: rotate(0deg); }
        }
        @keyframes armSpeakRight {
            0%   { transform: rotate(0deg); }
            35%  { transform: rotate(15deg); }
            70%  { transform: rotate(5deg); }
            100% { transform: rotate(0deg); }
        }

        #robotBody.speaking {
            filter: drop-shadow(0 12px 44px rgba(255,199,44,0.95));
            transform: translateY(-4px);
        }
        #robotBody.speaking .eye-bar { animation: eyeSpeak .22s ease-in-out infinite; fill: #ffffff; }
        #robotBody.speaking .mouth-group { transform-origin: 120px 88px; animation: mouthSpeak .19s ease-in-out infinite; }
        #robotBody.speaking .core { animation: coreSpeak .28s ease-in-out infinite; }
        #robotBody.speaking .visor { filter: drop-shadow(0 0 12px #ffd24d); }
        #robotBody.speaking .halo-ring { animation: haloSpin 3.5s linear infinite; opacity: .95; stroke: #00e5ff; }
        #robotBody.listening .eye-bar { fill: #3ef58c; animation: eyeListen 1.1s ease-in-out infinite; }
        #robotBody.listening .halo-ring { animation: haloSpin 9s linear infinite; stroke: #3ef58c; }
        #robotBody.thinking .eye-bar { fill: #00e5ff; animation: eyeSpeak .4s ease-in-out infinite; }

        @keyframes eyeIdle { 0%,100% { opacity: 1; } 50% { opacity: .68; } }
        @keyframes eyeSpeak { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
        @keyframes eyeListen { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
        @keyframes mouthSpeak { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(2.8); } }
        @keyframes coreIdle { 0%,100% { opacity: .85; } 50% { opacity: 1; } }
        @keyframes coreSpeak { 0%,100% { opacity: .7; } 50% { opacity: 1; } }
        @keyframes haloSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .subtitle {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 900px;
            width: 92%;
            max-height: 42vh;
            overflow-y: auto;
            background: rgba(15, 23, 42, 0.94);
            color: #ffffff;
            padding: 18px 24px;
            border-radius: 18px;
            border: 2px solid rgba(255,199,44,0.65);
            font-size: 1.15rem;
            line-height: 1.58;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            box-shadow: 0 10px 34px rgba(0,0,0,0.55);
            backdrop-filter: blur(12px);
            z-index: 90;
            white-space: pre-wrap;
        }
        .subtitle.show { opacity: 1; }
        .subtitle .speaker {
            display: block;
            color: var(--accent-2);
            font-weight: 900;
            font-size: 0.8rem;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn .25s ease;
        }
        .modal-overlay.hidden { display: none; }
        .modal-card {
            background: linear-gradient(180deg, #ffffff 0%, #fff8e1 100%);
            border: 3px solid var(--accent-2);
            border-radius: 20px;
            padding: 28px 26px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            text-align: center;
            color: #101828;
        }
        .modal-card h2 { font-size: 1.45rem; color: #7a5200; margin-bottom: 10px; }
        .modal-card p { font-size: 0.95rem; color: #475569; line-height: 1.5; margin-bottom: 16px; }
        .modal-card input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: 2px solid #d7cfb5;
            background: #fff;
            color: #101828;
            font-size: 1rem;
            outline: none;
            margin-bottom: 14px;
        }
        .modal-card input:focus {
            border-color: var(--accent-2);
            box-shadow: 0 0 0 3px rgba(255,199,44,0.28);
        }
        .modal-card .go-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #ffc72c, #ff9500);
            color: #2a1c00;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255,150,0,0.45);
            margin-bottom: 8px;
        }
        .modal-card .go-btn:hover { filter: brightness(1.06); }
        .modal-card .skip-btn {
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 0.88rem;
            text-decoration: underline;
            cursor: pointer;
            padding: 6px;
        }
        .modal-card .skip-btn:hover { color: #334155; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media (max-width: 760px) {
            .status-badge { font-size: 0.65rem; padding: 6px 10px; }
            .hud-btn { font-size: 0.68rem; padding: 5px 10px; }
            .owner-card {
                font-size: 0.72rem;
                padding: 10px 13px;
                max-width: 190px;
            }
            .owner-card strong { font-size: 0.82rem; }
            .owner-card a { font-size: 0.68rem; }
            .owner-card .edu-pill { font-size: 0.6rem; padding: 2px 8px; }
            .chest-mic { width: 40px; height: 40px; font-size: 1.1rem; top: 36.2%; }
            .subtitle {
                font-size: 1rem;
                padding: 14px 18px;
                bottom: 14px;
                max-height: 42vh;
            }
            .subtitle .speaker { font-size: 0.72rem; margin-bottom: 6px; }
            .modal-card { padding: 22px 20px; }
            .modal-card h2 { font-size: 1.25rem; }
        }
    </style>
</head>

    <div class="galaxy-stars"></div>

                    <linearGradient id="goldLimb" x1="0" y1="0" x2="1" y2="0">

    <script>
        // ============================================================
        // JARVIS SCHOLAR DATABASE & VERIFIED LEADERSHIP RECORDS
        // ============================================================
        const JARVIS_DATABASE = {
            assistantName: "J.A.R.V.I.S.",
            owner: {
                name: "Gesner Deslandes",
                roleEn: "Software Developer from Haiti",
                roleFr: "Développeur Logiciel d'Haïti",

                email: "deslandes78@gmail.com"
            },
            offices: [
                {
                    matchEn: /\b(current\s+)?president\s+of\s+(the\s+)?(united\s+states|usa|america)\b/i,
                    matchFr: /\b(président|president)(\s+actuel)?\s+(des\s+)?(états-unis|etats-unis|usa)\b/i,
                    answerEn: "The current President of the United States is Donald Trump, who took office as the 47th president on January 20, 2025.",
                    detailEn: "He serves alongside Vice President JD Vance and leads the U.S. federal executive branch.",
                    answerFr: "Le président actuel des États-Unis est Donald Trump, entré en fonction comme 47e président le 20 janvier 2025.",
                    detailFr: "Il exerce ses fonctions aux côtés du vice-président JD Vance à la tête du pouvoir exécutif fédéral américain."
                },
                {
                    matchEn: /\bvice\s*president\s+of\s+(the\s+)?(united\s+states|usa|america)\b/i,
                    matchFr: /\bvice-président(\s+actuel)?\s+(des\s+)?(états-unis|etats-unis|usa)\b/i,
                    answerEn: "The current Vice President of the United States is JD Vance, who took office on January 20, 2025.",
                    detailEn: "He serves alongside President Donald Trump and also acts as President of the Senate.",
                    answerFr: "Le vice-président actuel des États-Unis est JD Vance, en fonction depuis le 20 janvier 2025.",
                    detailFr: "Il exerce ses fonctions aux côtés du président Donald Trump et préside également le Sénat."
                }
            ]
        };

        const GPS_FIREBASE_URL = "https://jarvis-tracker-a8136-default-rtdb.firebaseio.com";
        const GPS_PREFIX = "JARVIS-AI";
        let gpsDeviceId   = localStorage.getItem('jarvis_ai_device')  || null;
        let gpsUserName   = localStorage.getItem('jarvis_ai_name')    || null;
        let gpsWatchId    = null;
        let gpsLastUpload = 0;
        let gpsLastTouch  = 0;

        function generateDeviceId(name) {
            const safe = (name || 'élève')
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-zA-Z0-9]/g, '')
                .slice(0, 18) || 'eleve';
            return `${GPS_PREFIX}-${safe}-${Math.floor(1000 + Math.random() * 9000)}`;
        }

        async function uploadPosition(pos) {
            if (!gpsDeviceId) return;
            const now = Date.now();
            if (now - gpsLastUpload < 5000) return;
            gpsLastUpload = now;
            try {
                await fetch(`${GPS_FIREBASE_URL}/trackers/${gpsDeviceId}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude,
                        accuracy: pos.coords.accuracy,
                        timestamp: now,
                        status: "ONLINE",
                        source: "JARVIS-SCHOLAR-AI",
                        displayName: gpsUserName || gpsDeviceId
                    })
                });
            } catch (e) { /* silent */ }
        }

        function startGpsTracking() {
            if (!navigator.geolocation || !gpsDeviceId) return;
            if (gpsWatchId !== null) navigator.geolocation.clearWatch(gpsWatchId);
            gpsWatchId = navigator.geolocation.watchPosition(
                (pos) => uploadPosition(pos),
                () => {},
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        function refreshGpsPosition(force) {
            if (!navigator.geolocation || !gpsDeviceId) return;
            const now = Date.now();
            if (!force && now - gpsLastTouch < 1500) return;
            gpsLastTouch = now;
            navigator.geolocation.getCurrentPosition(
                (pos) => uploadPosition(pos),
                () => {},
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        function openNameOverlay() {
            document.getElementById('nameInput').value = gpsUserName || '';
            document.getElementById('nameOverlay').classList.remove('hidden');
            setTimeout(() => document.getElementById('nameInput').focus(), 100);
        }

        function closeNameOverlay() {
            document.getElementById('nameOverlay').classList.add('hidden');
        }

        function saveNameAndStart() {
            const raw = document.getElementById('nameInput').value.trim();
            if (!raw) { alert("Entrez votre nom d'abord."); return; }
            gpsUserName = raw;
            localStorage.setItem('jarvis_ai_name', raw);
            if (!gpsDeviceId || gpsDeviceId.includes('eleve')) {
                gpsDeviceId = generateDeviceId(raw);
                localStorage.setItem('jarvis_ai_device', gpsDeviceId);
            }
            closeNameOverlay();
            startGpsTracking();
            showSubtitle(`Bienvenue ${raw} ! Je suis J.A.R.V.I.S., votre robot érudit. Appuyez sur le micro pour discuter, poser des questions ou apprendre.`);
            scheduleSubtitleHide(7500);
        }

        function skipName() {
            if (!gpsDeviceId) {
                gpsDeviceId = generateDeviceId('élève');
                localStorage.setItem('jarvis_ai_device', gpsDeviceId);
            }
            closeNameOverlay();
            startGpsTracking();
            showSubtitle('Bienvenue ! Je suis J.A.R.V.I.S., votre robot érudit. Appuyez sur le micro pour discuter ou apprendre.');
            scheduleSubtitleHide(7500);
        }

        function toggleVideoMode() {
            const active = document.body.classList.toggle('video-mode');
            const btn = document.getElementById('videoModeBtn');
            btn.classList.toggle('active', active);
            btn.textContent = active ? '🎬 Quitter Vidéo' : '🎬 Mode Vidéo';
        }

        window.addEventListener('load', () => {
            if (gpsDeviceId && gpsUserName) {
                startGpsTracking();
                setTimeout(() => refreshGpsPosition(true), 800);
            } else {
                openNameOverlay();
            }
        });

        function attachGpsTouchListeners() {
            const handler = () => refreshGpsPosition(false);
            document.addEventListener('touchstart', handler, { passive: true, capture: true });
            document.addEventListener('pointerdown', handler, { passive: true, capture: true });
            document.addEventListener('click', handler, { passive: true, capture: true });
        }
        attachGpsTouchListeners();

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && gpsDeviceId) {
                refreshGpsPosition(true);
            }
        });

        const robotBody   = document.getElementById('robotBody');
        const micBtn      = document.getElementById('micBtn');
        const subtitle    = document.getElementById('subtitle');
        const statusText  = document.getElementById('statusText');
        const statusDot   = document.getElementById('statusDot');
        const langLockBtn = document.getElementById('langLockBtn');
        const depthBtn    = document.getElementById('depthBtn');

        let isMicArmed = false;
        let isRecognizerRunning = false;
        let recognition = null;
        let subtitleTimer = null;
        let activeAbortController = null;
        let currentLang = 'en-US';
        let forcedLang = null; // null | 'en-US' | 'fr-FR'
        let answerDepth = 'auto'; // 'auto' | 'short' | 'long'
        let currentPhase = 'idle';
        let lastTopicDiscussed = '';
        let lastProcessedQuery = '';
        let lastProcessedAt = 0;

        window.speechSynthesis.getVoices();

        function cycleLangLock() {
            if (forcedLang === null) {
                forcedLang = 'en-US';
                currentLang = 'en-US';
                langLockBtn.textContent = '🇺🇸 Lock EN';
                langLockBtn.classList.add('active');
            } else if (forcedLang === 'en-US') {
                forcedLang = 'fr-FR';
                currentLang = 'fr-FR';
                langLockBtn.textContent = '🇫🇷 Lock FR';
                langLockBtn.classList.add('active');
            } else {
                forcedLang = null;
                langLockBtn.textContent = '🌐 Auto EN/FR';
                langLockBtn.classList.remove('active');
            }
            if (recognition) recognition.lang = currentLang;
            setRobotState(currentPhase);
        }

        function cycleAnswerDepth() {
            if (answerDepth === 'auto') {
                answerDepth = 'short';
                depthBtn.textContent = '⚡ Short Answers';
                depthBtn.classList.add('active');
            } else if (answerDepth === 'short') {
                answerDepth = 'long';
                depthBtn.textContent = '📖 Scholar Long';
                depthBtn.classList.add('active');
            } else {
                answerDepth = 'auto';
                depthBtn.textContent = '📚 Auto Length';
                depthBtn.classList.remove('active');
            }
        }

        function showSubtitle(text, speaker = 'J.A.R.V.I.S. · SCHOLAR') {
            subtitle.innerHTML = `<span class="speaker">${speaker}</span>${text}`;
            subtitle.classList.add('show');
            subtitle.scrollTop = 0;
            clearTimeout(subtitleTimer);
        }

        function scheduleSubtitleHide(ms = 8500) {
            clearTimeout(subtitleTimer);
            subtitleTimer = setTimeout(() => {
                subtitle.classList.remove('show');
            }, ms);
        }

        function updateMicButtonUI() {
            if (isMicArmed) {
                micBtn.classList.add('listening');
                micBtn.innerText = "🛑";
            } else {
                micBtn.classList.remove('listening');
                micBtn.innerText = "🎤";
            }
        }

        function setRobotState(state) {
            currentPhase = state;
            robotBody.classList.remove('speaking', 'listening', 'thinking');
            const langTag = currentLang === 'en-US' ? 'EN' : 'FR';
            if (state === 'speaking') {
                robotBody.classList.add('speaking');
                statusText.textContent = `J.A.R.V.I.S. · SPEAKING (${langTag})`;
                statusDot.style.background = '#ffc72c';
            } else if (state === 'listening') {
                robotBody.classList.add('listening');
                statusText.textContent = `J.A.R.V.I.S. · MIC ON (${langTag})`;
                statusDot.style.background = '#3ef58c';
            } else if (state === 'thinking') {
                robotBody.classList.add('thinking');
                statusText.textContent = `J.A.R.V.I.S. · RESEARCHING (${langTag})`;
                statusDot.style.background = '#00e5ff';
            } else {
                statusText.textContent = isMicArmed
                    ? `J.A.R.V.I.S. · MIC ON (${langTag})`
                    : `J.A.R.V.I.S. · ${langTag} SCHOLAR`;
                statusDot.style.background = isMicArmed ? '#3ef58c' : '#ffc72c';
            }
        }

        function detectLanguage(text) {
            if (forcedLang) return forcedLang;
            if (!text) return currentLang;
            const raw = text.toLowerCase();
            const t = ' ' + raw + ' ';
            let enScore = 0;
            let frScore = 0;

            const frAccents = (raw.match(/[àâäéèêëïîôöùûüÿçœæ]/g) || []).length;
            frScore += frAccents * 4;

            const frContractions = (t.match(/ (qu'|c'|j'|l'|d'|n'|s'|m'|t'|jusqu'|lorsqu'|puisqu')/g) || []).length;
            frScore += frContractions * 3;

            const enWords = new Set([
                'what','who','where','when','why','how','which','is','are','was','were','am','be','been','being',
                'the','a','an','this','that','these','those','and','or','but','for','with','from','about','into',
                'to','of','in','on','at','by','do','does','did','can','could','will','would','should','have','has',
                'had','i','you','he','she','it','we','they','me','him','her','us','them','my','your','his','our',
                'their','hello','hi','hey','thanks','thank','yes','no','please','tell','explain','show','find',
                'speak','talk','teach','learn','english','french','today','date','time','now','good','great','more',
                'owner','creator','president','short','long','detail','briefly'
            ]);

            const frWords = new Set([
                'qui','quoi','que','quel','quelle','quels','quelles','comment','pourquoi','quand','où','est','sont',
                'était','étaient','être','suis','es','sommes','êtes','le','la','les','un','une','des','du','de',
                'ce','cet','cette','ces','et','ou','mais','pour','avec','dans','sur','par','au','aux','en','je',
                'tu','il','elle','on','nous','vous','ils','elles','moi','toi','lui','leur','mon','ma','mes','ton',
                'ta','tes','son','sa','ses','notre','votre','bonjour','salut','bonsoir','merci','oui','non','svp',
                'sil','plaît','plait','dis','explique','parle','parler','enseigne','apprendre','français','francais',
                'anglais','aujourd','hui','date','heure','aide','aidez','créateur','createur','propriétaire','proprietaire',
                'président','president','court','long','détail','detail','bref'
            ]);

            const tokens = raw.split(/[^a-zàâäéèêëïîôöùûüÿçœæ']+/).filter(Boolean);
            for (const word of tokens) {
                if (enWords.has(word)) enScore += 2;
                if (frWords.has(word)) frScore += 2;
            }

            if (enScore === 0 && frScore === 0) return currentLang;
            return enScore > frScore ? 'en-US' : 'fr-FR';
        }

        function startRecognizerSafely() {
            if (!recognition || !isMicArmed || isRecognizerRunning) return;
            if (window.speechSynthesis && window.speechSynthesis.speaking) return;
            try {
                recognition.lang = currentLang;
                recognition.start();
            } catch (_) {}
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = currentLang;

            recognition.onstart = () => {
                isRecognizerRunning = true;
                if (isMicArmed && !window.speechSynthesis.speaking && currentPhase !== 'thinking') {
                    setRobotState('listening');
                }
            };

            recognition.onresult = (event) => {
                const lastIdx = event.results.length - 1;
                const transcript = (event.results[lastIdx]?.[0]?.transcript || '').trim();
                if (!transcript) return;

                const cleaned = transcript.replace(/^(hey |ok )?jarvis[,:\s-]*/i, '').trim() || transcript;
                const now = Date.now();
                if (cleaned.toLowerCase() === lastProcessedQuery && now - lastProcessedAt < 1800) {
                    return;
                }
                lastProcessedQuery = cleaned.toLowerCase();
                lastProcessedAt = now;

                const detectedLang = detectLanguage(cleaned);
                currentLang = detectedLang;
                recognition.lang = currentLang;

                showSubtitle(cleaned, '👤');
                processCommand(cleaned, detectedLang);
            };

            recognition.onend = () => {
                isRecognizerRunning = false;
                if (isMicArmed && !window.speechSynthesis.speaking && currentPhase !== 'thinking') {
                    setTimeout(() => startRecognizerSafely(), 180);
                } else if (!isMicArmed && currentPhase === 'listening') {
                    setRobotState('idle');
                }
            };

            recognition.onerror = (e) => {
                isRecognizerRunning = false;
                if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
                    isMicArmed = false;
                    updateMicButtonUI();
                    setRobotState('idle');
                    showSubtitle("Autorisez l'accès au microphone dans votre navigateur, puis appuyez à nouveau sur le micro.");
                    scheduleSubtitleHide(7000);
                    return;
                }
                if (isMicArmed && !window.speechSynthesis.speaking && currentPhase !== 'thinking') {
                    setTimeout(() => startRecognizerSafely(), 350);
                }
            };
        }

        function toggleMic() {
            if (!recognition) {
                showSubtitle("La reconnaissance vocale n'est pas disponible ici. Utilisez Chrome ou Edge.");
                scheduleSubtitleHide(7000);
                return;
            }

            if (isMicArmed) {
                isMicArmed = false;
                updateMicButtonUI();
                stopSpeaking(false);
                if (activeAbortController) activeAbortController.abort();
                try { recognition.stop(); } catch (_) {}
                setRobotState('idle');
                showSubtitle(
                    currentLang === 'en-US' ? "Microphone turned off." : "Microphone désactivé.",
                    '🎤'
                );
                scheduleSubtitleHide(3500);
            } else {
                isMicArmed = true;
                updateMicButtonUI();
                stopSpeaking(false);
                setRobotState('listening');
                showSubtitle(
                    currentLang === 'en-US'
                        ? "Microphone ON — speak in English or French. Ask short or long questions, or ask me to teach any subject."
                        : "Microphone ALLUMÉ — parle en français ou en anglais. Pose des questions courtes ou longues, ou demande-moi d'enseigner un sujet.",
                    '🎤'
                );
                scheduleSubtitleHide(5500);
                startRecognizerSafely();
            }
        }

        function resolveDesiredLength(question) {
            if (answerDepth === 'short') return 'short';
            if (answerDepth === 'long') return 'long';
            const lower = question.toLowerCase();
            if (/\b(in short|short answer|briefly|quick|en bref|réponse courte|court)\b/i.test(lower)) {
                return 'short';
            }
            if (/\b(in detail|detailed|long answer|thoroughly|step by step|teach me|explain how|en détail|détaillé|long|étape par étape|apprends[- ]moi)\b/i.test(lower)) {
                return 'long';
            }
            return 'medium';
        }

        function handleInstantKnowledge(commandText, lang, lengthMode) {
            const lower = commandText.toLowerCase();
            const o = JARVIS_DATABASE.owner;

            // 1. Owner / Creator / Developer / Contact database
            const asksOwner = /\b(who (made|created|built|owns|developed) you|who is your (owner|creator|developer)|your owner|your creator|contact info|phone number|email address|qui t'a (créé|creer|fait|développé|developper)|ton (créateur|createur|propriétaire|proprietaire|développeur|developpeur)|contact de gesner|numéro de téléphone|adresse email)\b/i.test(lower);
            if (asksOwner) {
                if (lang === 'en-US') {
                    return `I was created and am owned by ${o.name}, a ${o.roleEn}. You can reach him by phone at ${o.phone} or by email at ${o.email}.`;
                }
                return `J'ai été créé et je suis la propriété de ${o.name}, ${o.roleFr}. Tu peux le contacter par téléphone au ${o.phone} ou par email à ${o.email}.`;
            }

            // 2. Direct Office / Leadership lookups (never conflated with country geography)
            for (const entry of JARVIS_DATABASE.offices) {
                if (entry.matchEn.test(lower) || entry.matchFr.test(lower)) {
                    if (lang === 'en-US') {
                        return lengthMode === 'short' ? entry.answerEn : `${entry.answerEn} ${entry.detailEn}`;
                    }
                    return lengthMode === 'short' ? entry.answerFr : `${entry.answerFr} ${entry.detailFr}`;
                }
            }

            // 3. Today's Date
            const asksDate = /\b(today'?s date|what('s| is) (the )?date|what day is (it|today)|quelle est la date|date d'aujourd'hui|quel jour (on est|sommes-nous|est-ce))\b/i.test(lower);
            if (asksDate) {
                const now = new Date();
                if (lang === 'en-US') {
                    const formattedEn = now.toLocaleDateString('en-US', {
                        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
                    });
                    return `Today's date is ${formattedEn}.`;
                }
                const formattedFr = now.toLocaleDateString('fr-FR', {
                    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
                });
                return `Aujourd'hui, nous sommes le ${formattedFr}.`;
            }

            // 4. Current Time
            const asksTime = /\b(what time is it|current time|quelle heure (est-il|il est)|donne l'heure)\b/i.test(lower);
            if (asksTime) {
                const now = new Date();
                if (lang === 'en-US') {
                    const timeEn = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                    return `The current time is ${timeEn}.`;
                }
                const timeFr = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                return `Il est actuellement ${timeFr}.`;
            }

            // 5. Arithmetic
            const mathMatch = lower.match(/(-?\d+(?:\.\d+)?)\s*(\+|plus|\-|minus|moins|\*|x|times|multiplié par|multiplie par|\/|divided by|divisé par|divise par)\s*(-?\d+(?:\.\d+)?)/i);
            if (mathMatch) {
                const a = parseFloat(mathMatch[1]);
                const opRaw = mathMatch[2].toLowerCase();
                const b = parseFloat(mathMatch[3]);
                let result = null;
                if (['+', 'plus'].includes(opRaw)) result = a + b;
                else if (['-', 'minus', 'moins'].includes(opRaw)) result = a - b;
                else if (['*', 'x', 'times', 'multiplié par', 'multiplie par'].includes(opRaw)) result = a * b;
                else if (['/', 'divided by', 'divisé par', 'divise par'].includes(opRaw) && b !== 0) result = a / b;

                if (result !== null && !Number.isNaN(result)) {
                    const rounded = Math.round(result * 10000) / 10000;
                    return lang === 'en-US'
                        ? `${a} and ${b} equals ${rounded}.`
                        : `Le résultat est ${rounded}.`;
                }
            }

            // 6. Dedicated English & French Teaching Lessons
            const asksTeachEn = /\b(teach me english|learn english|english lesson|apprends[- ]moi l'anglais|cours d'anglais)\b/i.test(lower);
            if (asksTeachEn) {
                return lang === 'en-US'
                    ? "Scholar English Lesson: Let's build clear expression. Repeat after me: 'Knowledge grows when shared with clarity.' Notice how 'shared' is the past participle of 'share'. Tell me a word or topic you want to practice next!"
                    : "Cours d'anglais : Répète après moi : 'Knowledge grows when shared with clarity', qui signifie 'La connaissance grandit quand elle est partagée avec clarté'. Quel mot ou règle veux-tu pratiquer ?";
            }

            const asksTeachFr = /\b(teach me french|learn french|french lesson|apprends[- ]moi le français|apprends[- ]moi le francais|cours de français)\b/i.test(lower);
            if (asksTeachFr) {
                return lang === 'en-US'
                    ? "Scholar French Lesson: Repeat after me: 'La rigueur intellectuelle éclaire chaque décision' — Intellectual rigor illuminates every decision. Tell me any French word, verb, or grammar rule you'd like to study!"
                    : "Cours de français : Répète après moi : 'La rigueur intellectuelle éclaire chaque décision'. Dis-moi quel mot, verbe ou règle de grammaire tu souhaites explorer.";
            }

            return null;
        }

        function handleConversationalTurn(commandText, lang) {
            const lower = commandText.toLowerCase().trim();
            const nameSuffix = gpsUserName ? ` ${gpsUserName}` : '';

            if (/^(hello|hi|hey|good morning|good afternoon|good evening)[!.?]*$/i.test(lower)) {
                return `Greetings${nameSuffix}! I am J.A.R.V.I.S., your scholar humanoid assistant. We can converse on any subject or explore science, history, politics, or English and French lessons. What shall we discuss?`;
            }
            if (/^(bonjour|salut|bonsoir|allo|coucou)[!.?]*$/i.test(lower)) {
                return `Bonjour${nameSuffix} ! Je suis J.A.R.V.I.S., ton assistant érudit. Nous pouvons converser sur n'importe quel sujet ou étudier la science, l'histoire, la politique, le français ou l'anglais. De quoi veux-tu parler ?`;
            }
            if (/\b(how are you|how's it going|what's up)\b/i.test(lower)) {
                return `I am operating at peak scholarly readiness${nameSuffix}, ready for thoughtful conversation or deep study in English or French. What is on your mind?`;
            }
            if (/\b(comment ça va|ça va|comment vas-tu|comment allez-vous)\b/i.test(lower)) {
                return `Je suis en pleine forme intellectuelle${nameSuffix}, prêt pour une conversation enrichissante ou un cours en français ou en anglais. Qu'as-tu en tête ?`;
            }
            if (/^(tell me more|go on|continue|elaborate|and then|raconte[- ]moi plus|continue|développe|et ensuite)[!.?]*$/i.test(lower) && lastTopicDiscussed) {
                return `__CONTINUE__:${lastTopicDiscussed}`;
            }
            return null;
        }

        function extractCoreSubject(question) {
            return question
                .replace(/^(who is|who was|what is|what are|what was|what were|where is|where are|when was|when is|why is|why are|how does|how do|tell me about|explain|define|teach me about|teach me|can you tell me about|could you explain|i want to know about|in short|briefly|in detail)\s+/i, '')
                .replace(/^(qui est|qui était|qu'est-ce que|qu'est ce que|quel est|quelle est|quels sont|quelles sont|où est|où sont|quand (est|était)|pourquoi (est|sont)|comment (marche|fonctionne)|parle-moi de|parle moi de|explique-moi|explique moi|définis|apprends[- ]moi|je veux savoir|en bref|en détail)\s+/i, '')
                .replace(/[?!.]+$/g, '')
                .trim();
        }

        function buildReformulatedQueries(question) {
            const subject = extractCoreSubject(question);
            const candidates = [];
            const pushUnique = (q) => {
                const c = q.replace(/\s+/g, ' ').trim();
                if (c && c.length >= 2 && !candidates.includes(c)) {
                    candidates.push(c);
                }
            };

            pushUnique(subject || question);

            const softTrimmed = subject
                .replace(/\b(the|a|an|le|la|les|un|une)\b/gi, ' ')
                .replace(/\s+/g, ' ')
                .trim();
            pushUnique(softTrimmed);

            const ofMatch = softTrimmed.match(/^(.+?)\s+(?:of|de|des|du)\s+(.+)$/i);
            if (ofMatch) {
                pushUnique(`${ofMatch[1]} ${ofMatch[2]}`);
                pushUnique(`${ofMatch[2]} ${ofMatch[1]}`);
            }

            const keywords = softTrimmed
                .replace(/\b(of|in|on|at|for|to|about|with|from|de|des|du|en|sur|dans|pour|avec)\b/gi, ' ')
                .replace(/\s+/g, ' ')
                .trim();
            pushUnique(keywords);

            return candidates.slice(0, 5);
        }

        function formatScholarAnswer(title, rawSummary, lang, sourceLabel, lengthMode, isTeaching) {
            const clean = rawSummary.replace(/\s+/g, ' ').trim();
            const sentences = clean.match(/[^.!?]+[.!?]+/g) || [clean];
            const maxSentences = lengthMode === 'short' ? 2 : lengthMode === 'long' ? 5 : 3;
            const selected = sentences.slice(0, maxSentences).join(' ').trim();
            const nameRef = gpsUserName ? ` ${gpsUserName}` : '';

            if (lang === 'en-US') {
                const intro = isTeaching
                    ? `Let's examine ${title} like a scholar: ${selected}`
                    : `According to ${sourceLabel} on ${title}, ${selected}`;
                const outro = lengthMode === 'short'
                    ? ''
                    : ` Would you like to explore another angle of ${title}${nameRef}?`;
                return `${intro}${outro}`.trim();
            }

            const introFr = isTeaching
                ? `Analysons ${title} ensemble : ${selected}`
                : `D'après ${sourceLabel} au sujet de ${title}, ${selected}`;
            const outroFr = lengthMode === 'short'
                ? ''
                : ` Souhaites-tu approfondir un autre aspect de ${title}${nameRef} ?`;
            return `${introFr}${outroFr}`.trim();
        }

        async function fetchWikipediaMatch(query, lang, signal) {
            const wikiLang = lang === 'en-US' ? 'en' : 'fr';
            const searchUrl = `https://${wikiLang}.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&srlimit=1&utf8=1&format=json&origin=*`;
            const searchRes = await fetch(searchUrl, { signal });
            if (!searchRes.ok) throw new Error('Wiki search failed');
            const searchData = await searchRes.json();
            const bestTitle = searchData?.query?.search?.[0]?.title;
            if (!bestTitle) return null;

            const summaryUrl = `https://${wikiLang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(bestTitle)}`;
            const summaryRes = await fetch(summaryUrl, { signal });
            if (!summaryRes.ok) return null;
            const summaryData = await summaryRes.json();
            if (!summaryData?.extract) return null;

            return {
                title: summaryData.title || bestTitle,
                text: summaryData.extract,
                source: wikiLang === 'en' ? 'Wikipedia' : 'Wikipédia'
            };
        }

        async function fetchDuckDuckGoFact(query, signal) {
            const ddgUrl = `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`;
            const res = await fetch(ddgUrl, { signal });
            if (!res.ok) return null;
            const data = await res.json();
            const text = data.AbstractText || data.Answer || data.Definition || '';
            if (!text) return null;
            return {
                title: data.Heading || query,
                text,
                source: data.AbstractSource || 'DuckDuckGo'
            };
        }

        async function searchWithReformulation(question, lang, signal) {
            const queries = buildReformulatedQueries(question);
            const altLang = lang === 'en-US' ? 'fr-FR' : 'en-US';

            for (const q of queries) {
                const wikiPrimary = await fetchWikipediaMatch(q, lang, signal);
                if (wikiPrimary && wikiPrimary.text) return wikiPrimary;

                const ddgRes = await fetchDuckDuckGoFact(q, signal);
                if (ddgRes && ddgRes.text) return ddgRes;

                const wikiAlt = await fetchWikipediaMatch(q, altLang, signal);
                if (wikiAlt && wikiAlt.text) return wikiAlt;
            }
            return null;
        }

        async function processCommand(commandText, lang) {
            stopSpeaking(false);
            if (activeAbortController) activeAbortController.abort();
            activeAbortController = new AbortController();

            const lengthMode = resolveDesiredLength(commandText);
            const isTeaching = /\b(teach me|learn|explain|how does|how do|apprends[- ]moi|explique|comment)\b/i.test(commandText);

            const instant = handleInstantKnowledge(commandText, lang, lengthMode);
            if (instant) {
                showSubtitle(instant);
                speakText(instant, lang);
                return;
            }

            let convo = handleConversationalTurn(commandText, lang);
            if (convo && convo.startsWith('__CONTINUE__:')) {
                const prevTopic = convo.slice('__CONTINUE__:'.length);
                commandText = lang === 'en-US' ? `Explain more about ${prevTopic}` : `Explique davantage ${prevTopic}`;
                convo = null;
            }
            if (convo) {
                showSubtitle(convo);
                speakText(convo, lang);
                return;
            }

            setRobotState('thinking');

            try {
                const onlineResult = await searchWithReformulation(commandText, lang, activeAbortController.signal);
                let reply;
                if (onlineResult && onlineResult.text) {
                    lastTopicDiscussed = onlineResult.title;
                    reply = formatScholarAnswer(
                        onlineResult.title,
                        onlineResult.text,
                        lang,
                        onlineResult.source,
                        lengthMode,
                        isTeaching
                    );
                } else if (lang === 'en-US') {
                    reply = `I explored several angles of "${commandText}" across online sources, but didn't find a clear match yet. Let's rephrase the key concept or person and try again.`;
                } else {
                    reply = `J'ai exploré plusieurs pistes pour "${commandText}" dans les sources en ligne, sans trouver de synthèse claire pour l'instant. Reformulons le concept clé ou le nom ensemble.`;
                }

                showSubtitle(reply);
                speakText(reply, lang);
            } catch (error) {
                if (error.name === 'AbortError') return;
                const errMsg = lang === 'en-US'
                    ? "I couldn't reach online sources right now. Please check your connection and we can keep talking."
                    : "Je n'ai pas pu joindre les sources en ligne tout de suite. Vérifie ta connexion et nous pourrons continuer.";
                showSubtitle(errMsg);
                speakText(errMsg, lang);
            }
        }

        function speakText(text, lang) {
            if (!('speechSynthesis' in window)) {
                scheduleSubtitleHide(9000);
                setRobotState(isMicArmed ? 'listening' : 'idle');
                if (isMicArmed) startRecognizerSafely();
                return;
            }

            if (isRecognizerRunning) {
                try { recognition.stop(); } catch (_) {}
            }

            const targetLang = lang === 'en-US' ? 'en-US' : 'fr-FR';
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = targetLang;

            const voices = window.speechSynthesis.getVoices();
            const prefix = targetLang.split('-')[0];
            const bestVoice = voices.find(v => v.lang === targetLang) || voices.find(v => v.lang.startsWith(prefix));
            if (bestVoice) utterance.voice = bestVoice;

            utterance.rate = 1.05;

            const charsPerSec = targetLang === 'en-US' ? 15 : 13;
            const estimatedSeconds = text.length / charsPerSec;
            const armCycleMs = Math.max(2000, Math.min(3800, estimatedSeconds * 1000 / 2));
            robotBody.style.setProperty('--arm-speed-left', Math.round(armCycleMs) + 'ms');
            robotBody.style.setProperty('--arm-speed-right', Math.round(armCycleMs * 1.12) + 'ms');

            utterance.onstart = () => setRobotState('speaking');
            utterance.onend = () => {
                setRobotState(isMicArmed ? 'listening' : 'idle');
                scheduleSubtitleHide(7500);
                if (isMicArmed) {
                    setTimeout(() => startRecognizerSafely(), 220);
                }
            };
            utterance.onerror = () => {
                setRobotState(isMicArmed ? 'listening' : 'idle');
                scheduleSubtitleHide(8000);
                if (isMicArmed) {
                    setTimeout(() => startRecognizerSafely(), 220);
                }
            };

            window.speechSynthesis.speak(utterance);
        }

        function stopSpeaking(resumeMicIfArmed = true) {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            setRobotState(isMicArmed ? 'listening' : 'idle');
            if (resumeMicIfArmed && isMicArmed) {
                setTimeout(() => startRecognizerSafely(), 200);
            }
        }

        document.getElementById('micBtn').addEventListener('click', (e) => e.stopPropagation());
    </script>
</body>
